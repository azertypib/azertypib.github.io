<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>EDT · suivi</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#141312;--panel:#1d1c1a;--ink:#f1ede7;--muted:#9a948c;--line:#2d2b28;--accent:#e0533d;--ok:#2fbf6a}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:44px;height:44px;border-radius:11px}
h1{font-size:20px;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
header button:last-child{margin-left:auto}
header button{flex:none}
h2{font-size:16px;margin:26px 0 8px}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px}
.tile b{font-size:34px;font-variant-numeric:tabular-nums;min-width:56px}
.tile span{flex:1;color:var(--muted);font-size:15px}
.tile i{font-style:normal;font-size:26px;color:var(--muted)}
.tile:active{transform:scale(.99)}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.n{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:#2e86d4;min-width:2px}
.al{background:var(--panel);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.al .m{color:var(--muted);font-size:12.5px;margin-bottom:4px}
.al .t{white-space:pre-wrap;word-break:break-word}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
button.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin:8px 0}
a{color:#6fb6f0}
.err{color:var(--accent)}
.scroll{overflow-x:auto}
.conv{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:14px;padding:10px;margin:10px 0}
.bul{max-width:82%;align-self:flex-start;background:#262422;border-radius:14px 14px 14px 4px;padding:7px 11px;white-space:pre-wrap;word-break:break-word}
.bul.moi{align-self:flex-end;background:#2e86d4;color:#fff;border-radius:14px 14px 4px 14px}
.bul small{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.fil{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.fil .av{width:40px;height:40px;border-radius:50%;background:#12808a;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.fil .tx{flex:1;min-width:0}.fil .tx b{display:block}.fil .tx span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pas{background:#2e86d4;color:#fff;border-radius:10px;padding:1px 8px;font-size:12.5px;font-weight:700}
textarea{font:inherit;font-size:16px;width:100%;min-height:80px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Page privée de suivi : tout passe par la fonction Supabase admin_stats(cle) ; sans la bonne clé, rien n'est lisible.
const SUPA_URL = "https://oysfbsdpdcjpufrfpmjx.supabase.co";
const SUPA_KEY = "sb_publishable_qHE46e33ZJ-_AFLZkXG4YA_ty7QAaXx";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (d, o) => new Date(d).toLocaleString("fr-FR", o || {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const day = d => new Date(d + "T12:00").toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
const tpLbl = t => !t ? "?" : t.replace("TP"," TP");   // garde l'année : S1 TP1, S3 TP4
// répartition par année (S1, S3…) d'une liste qui porte un TP
const parAn = l => { const n = {}; l.forEach(x => { const y = (String(x.tp||"").match(/^S\d/)||["?"])[0]; n[y] = (n[y]||0)+1; });
  return Object.keys(n).sort().map(y => `${y} ${n[y]}`).join(" · "); };

function askKey(msg){
  $("app").innerHTML = `<header><img src="icon.png" alt=""><div><h1>Suivi de l'appli</h1><p>Page privée</p></div></header>
    <p>Colle ta clé (fichier <b>admin-cle.txt</b> sur ton ordinateur). Elle reste enregistrée sur cet appareil seulement.</p>
    <input id="k" type="password" autocomplete="off" placeholder="Clé" oninput="if(this.value.trim().length>=32) saveKey()" onkeydown="if(event.key==='Enter') saveKey()">
    <button class="dark" onclick="saveKey()">Entrer</button> ${msg ? `<p class="err">${esc(msg)}</p>` : ""}`;
  $("k").focus();   // la clé collée suffit : ça s'ouvre tout seul dès qu'elle est complète
}
function saveKey(){ const k = $("k").value.trim(); if(!k) return; localStorage.setItem("adm.cle", k); load(); }
function forget(){ localStorage.removeItem("adm.cle"); askKey(); }

async function load(){
  const cle = localStorage.getItem("adm.cle");
  if(!cle) return askKey();
  $("app").innerHTML = `<p class="note">Chargement…</p>`;
  let r;
  try{
    r = await fetch(`${SUPA_URL}/rest/v1/rpc/admin_stats`, {method:"POST",
      headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle})});
  }catch{ return askKey("Pas de connexion internet."); }
  if(!r.ok){ localStorage.removeItem("adm.cle"); return askKey("Clé refusée."); }
  const s = await r.json();
  try{ const e = await fetch(`${SUPA_URL}/rest/v1/etat?select=maintenance,ferme&id=eq.1`, {headers:{apikey:SUPA_KEY}}); const [x] = await e.json(); s.maint = !!x?.maintenance; s.ferme = !!x?.ferme; }catch{}
  try{ const c = await fetch(`${SUPA_URL}/rest/v1/rpc/admin_comptes`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle})}); s.cpt = c.ok ? await c.json() : null; }catch{}
  try{ const m = await fetch(`${SUPA_URL}/rest/v1/rpc/admin_retours`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle})}); s.ret = m.ok ? await m.json() : []; }catch{ s.ret = []; }
  show(s);
}
// une conversation par compte (anciens messages sans compte : une chacun)
const fils = () => { const g = {}; (S.ret||[]).forEach(m => { const k = m.compte_id ? "c"+m.compte_id : "r"+m.id; (g[k] ||= {k, compte:m.compte_id, pseudo:m.pseudo, email:m.email, email_ok:m.email_ok, tp:m.tp, l:[]}).l.push(m); });
  return Object.values(g).sort((a,b) => a.l.at(-1).created_at < b.l.at(-1).created_at ? 1 : -1); };
const nonLus = f => f.l.filter(m => !m.du_createur && !m.lu).length;
async function ouvrirFil(k){ view = "fil:"+k; draw(); scrollTo(0, document.body.scrollHeight);
  const f = fils().find(x => x.k===k); if(f?.compte && nonLus(f)){ f.l.forEach(m => m.lu = true);
    fetch(`${SUPA_URL}/rest/v1/rpc/admin_lu`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle:localStorage.getItem("adm.cle"), p_compte:f.compte})}).catch(()=>{}); } }
async function repondre(compte){
  const t = $("rep").value.trim(); if(!t) return; $("repgo").disabled = true;
  try{ const r = await fetch(`${SUPA_URL}/functions/v1/mail`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({action:"repondre", cle:localStorage.getItem("adm.cle"), compte, texte:t})});
    const j = await r.json(); if(!j.ok) throw 0;
    alert(j.mail ? "Réponse envoyée par mail et visible dans son appli." : "Réponse visible dans son appli. Le mail n'est pas parti (envoi de mails pas encore branché, ou adresse refusée).");
    const k = view.slice(4); await load(); ouvrirFil(k);
  }catch{ alert("Échec de l'envoi."); $("repgo").disabled = false; } }

// accueil = 3 cartouches avec juste le nombre ; le détail s'ouvre en touchant un cartouche
let S = null, view = null;
function show(s){ S = s; draw(); }   // « Actualiser » garde la liste ouverte
// avis « modifications en cours » : message montré une fois à tous, ne bloque rien ; à éteindre soi-même quand on a fini
async function toggleMaint(){
  const on = !S.maint;
  if(!confirm(on ? "Afficher à tout le monde « Modifications en cours : si quelque chose bug, pas d'inquiétude » ? Tout continue de fonctionner." : "Retirer l'avis ? Tout le monde verra « Modifications terminées ».")) return;
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/set_maintenance`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle:localStorage.getItem("adm.cle"), actif:on})});
  if(!r.ok){ alert("Échec : clé refusée ?"); return; }
  load();
}
// fermer le site : écran « Application fermée » pour tout le monde, plus rien ne marche (le serveur refuse aussi)
async function toggleFerme(){
  const on = !S.ferme;
  // double sécurité pour fermer : il faut taper FERMER (un toucher par erreur ne suffit pas) ; rouvrir = simple confirmation
  if(on){ const t = prompt("Fermer le site pour TOUT LE MONDE ? Plus personne ne pourra l'utiliser jusqu'à ce que tu le rouvres. Pour confirmer, tape FERMER :");
    if((t||"").trim().toUpperCase() !== "FERMER"){ if(t!==null) alert("Pas fermé : il fallait taper FERMER."); return; } }
  else if(!confirm("Rouvrir le site pour tout le monde ?")) return;
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/set_ferme`, {method:"POST", headers:{apikey:SUPA_KEY, "Content-Type":"application/json"}, body:JSON.stringify({cle:localStorage.getItem("adm.cle"), actif:on})});
  if(!r.ok){ alert("Échec : clé refusée ?"); return; }
  load();
}
function go(v){ view = v; draw(); scrollTo(0,0); }
function draw(){
  const s = S, today = new Date().toISOString().slice(0,10);
  const auj = s.jours.find(j => j.jour === today) || {personnes:0, nouvelles:0};
  const dons = s.dons.filter(d => !String(d.kofi_id).startsWith("00000000-1111"));   // dons de test Ko-fi exclus
  const total = dons.reduce((a,d) => a + Number(d.montant||0), 0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
  const head = (t, back) => `<header>${back ? `<button onclick="go(null)" aria-label="Retour">‹ Retour</button>` : `<img src="icon.png" alt="">`}
      <div><h1>${t}</h1><p>Mis à jour ${fmt(new Date())}</p></div><button onclick="load()">Actualiser</button></header>`;
  let h;
  if(!view){
    h = head("Suivi de l'appli") + `<div class="tiles">
      ${(()=>{ const fl = fils(), n = fl.reduce((a,f)=>a+nonLus(f),0); return `<button class="tile" onclick="go('messages')"><b>${n}</b><span>Message${n>1?"s":""} au créateur non lu${n>1?"s":""} · ${fl.length} conversation${fl.length>1?"s":""}</span><i>›</i></button>`; })()}
      <button class="tile" onclick="go('alertes')"><b>${s.alertes.length}</b><span>Messages censurés${s.alertes.length ? " · "+parAn(s.alertes) : ""}</span><i>›</i></button>
      <button class="tile" onclick="go('dons')"><b>${dons.length}</b><span>Dons · ${total}</span><i>›</i></button>
      <button class="tile" onclick="go('appareils')"><b>${s.appareils.length}</b><span>Appareils${s.appareils.length ? " ("+parAn(s.appareils)+")" : ""} · ${auj.personnes} aujourd'hui${auj.nouvelles ? `, ${auj.nouvelles} nouveau${auj.nouvelles>1?"x":""}` : ""}</span><i>›</i></button>
${s.cpt ? (()=>{ const c=s.cpt, j=c.jours.find(x=>x.jour===today)||{connexions:0}; const ch = c.comptes.filter(x=>x.charte_le).length; return `<button class="tile" onclick="go('comptes')"><b>${c.comptes.length}</b><span>Comptes · ${ch} charte${ch>1?"s":""} signée${ch>1?"s":""}${c.comptes.length ? " ("+parAn(c.comptes.map(x=>({tp:x.tp||x.annee})))+")" : ""} · ${j.connexions} connecté${j.connexions>1?"s":""} aujourd'hui${c.blocages.length ? ` · <b style="font-size:inherit;color:#e8833a">${c.blocages.length} blocage${c.blocages.length>1?"s":""}</b>` : ""}</span><i>›</i></button>`; })() : ""}
<button class="tile" onclick="toggleMaint()"><b style="color:${s.maint?"#e8833a":"var(--ok)"}">${s.maint?"ON":"OFF"}</b><span>${s.maint?"Avis « Modifications en cours » affiché. Touche quand tu as fini pour le retirer":"Avis « Modifications en cours » : éteint. Touche pour prévenir tout le monde que tu travailles sur l'appli"}</span><i>›</i></button>
<button class="tile" onclick="toggleFerme()"><b style="color:${s.ferme?"var(--accent)":"var(--ok)"}">${s.ferme?"FERMÉ":"OUVERT"}</b><span>${s.ferme?"Site fermé : personne ne peut l'utiliser. Touche pour le rouvrir":"Site ouvert. Touche pour le fermer (plus rien ne marche)"}</span><i>›</i></button>
    </div>
    <p style="margin-top:28px"><button onclick="forget()">Oublier la clé sur cet appareil</button></p>`;
  }else if(view==="alertes"){
    h = head(`Messages censurés (${s.alertes.length})`, 1) + (s.alertes.length
      ? s.alertes.map(a => `<div class="al"><div class="m">${esc(fmt(a.created_at))} · ${esc(a.lieu)} · ${esc(tpLbl(a.tp))} · pseudo : ${esc(a.pseudo || "aucun")} · appareil ${esc(String(a.device||"?").slice(0,8))}</div><div class="t">${esc(a.texte)}</div></div>`).join("")
      : `<p class="note">Aucun pour l'instant.</p>`)
      + `<p class="note">Texte tel qu'il a été écrit, avant censure. Le pseudo et le numéro d'appareil permettent de repérer quelqu'un qui recommence ; son e-mail est dans la liste des comptes.</p>`;
  }else if(view==="messages"){
    const fl = fils();
    h = head(`Messages au créateur (${fl.length})`, 1) + (fl.length ? fl.map(f => { const der = f.l.at(-1), n = nonLus(f);
      return `<button class="fil" onclick="ouvrirFil('${f.k}')"><span class="av">${esc((f.pseudo||"?")[0].toUpperCase())}</span><span class="tx"><b>${esc(f.pseudo||"Anonyme")} <small style="color:var(--muted);font-weight:400">${esc(tpLbl(f.tp))}</small></b><span>${der.du_createur?"Toi : ":""}${esc(der.texte)}</span></span>${n?`<span class="pas">${n}</span>`:`<small style="color:var(--muted)">${esc(fmt(der.created_at,{day:"numeric",month:"short"}))}</small>`}</button>`; }).join("")
      : `<p class="note">Aucun message pour l'instant.</p>`) + `<p class="note">Toi seul vois ces messages. Ta réponse arrive dans son appli et dans sa boîte mail.</p>`;
  }else if(view && view.startsWith("fil:")){
    const f = fils().find(x => x.k===view.slice(4));
    if(!f){ view = "messages"; return draw(); }
    h = `<header><button onclick="go('messages')">‹ Retour</button><div><h1>${esc(f.pseudo||"Anonyme")}</h1><p>${f.email ? esc(f.email) + (f.email_ok ? " ✓" : "") : "pas d'e-mail"} · ${esc(tpLbl(f.tp))}</p></div></header>
      <div class="conv">${f.l.map(m => `<div class="bul ${m.du_createur?"moi":""}">${esc(m.texte)}<small>${esc(fmt(m.created_at))}</small></div>`).join("")}</div>`
      + (f.compte ? `<textarea id="rep" maxlength="4000" placeholder="Répondre à ${esc(f.pseudo||"")}…"></textarea><p><button class="dark" id="repgo" onclick="repondre(${f.compte})">Envoyer la réponse</button></p>`
        : `<p class="note">Ancien message envoyé sans compte : pas de réponse possible.</p>`);
  }else if(view==="dons"){
    h = head(`Dons (${dons.length} · ${total})`, 1) + (dons.length
      ? `<table><tr><th>Date</th><th>Montant</th></tr>${dons.map(d => `<tr><td>${esc(fmt(d.created_at))}</td><td class="n">${esc(Number(d.montant).toLocaleString("fr-FR"))} ${esc(d.devise)}</td></tr>`).join("")}</table>`
      : `<p class="note">Aucun don pour l'instant.</p>`)
      + `<p class="note">Noms, messages et e-mails des donateurs : sur Ko-fi, <a href="https://ko-fi.com/manage/supportreceived" target="_blank" rel="noopener">Payments &amp; orders</a> et <a href="https://ko-fi.com/manage/supporters" target="_blank" rel="noopener">My supporters</a>. Virements vers ta banque : Stripe, rubrique Virements.</p>`;
  }else if(view==="comptes"){
    const c = s.cpt || {comptes:[], jours:[], blocages:[]};
    h = head(`Comptes (${c.comptes.length})`, 1)
      + (c.blocages.length ? `<h2>Blocages (5 mauvais codes)</h2>${c.blocages.map(b => `<div class="al"><div class="m">${esc(fmt(b.created_at))}</div><div class="t">Compte « ${esc(b.pseudo)} » bloqué 5 minutes</div></div>`).join("")}` : "")
      + `<h2>Par jour</h2><div class="scroll"><table><tr><th>Jour</th><th>Connectés</th><th>Comptes créés</th></tr>
      ${c.jours.map(j => `<tr><td>${esc(day(j.jour))}</td><td class="n">${j.connexions}</td><td class="n">${j.creations}</td></tr>`).join("")}</table></div>
      <h2>Liste</h2><div class="scroll"><table><tr><th>Pseudo</th><th>E-mail</th><th>TP</th><th>Charte</th><th>Créé le</th><th>Vu le</th></tr>
      ${c.comptes.map(x => `<tr><td>${esc(x.pseudo)}</td><td>${x.email ? esc(x.email) + (x.email_ok ? ' <span class="ok">✓</span>' : c.mail_actif ? " (à confirmer)" : "") : '<span style="color:var(--muted)">pas encore donné</span>'}</td><td>${esc(x.tp ? tpLbl(x.tp) : x.annee || "?")}</td><td>${x.charte_le ? esc(fmt(x.charte_le,{day:"numeric",month:"short"})) : '<span style="color:var(--muted)">non</span>'}</td><td>${esc(fmt(x.created_at,{day:"numeric",month:"short"}))}</td><td>${esc(fmt(x.vu_le))}</td></tr>`).join("")}</table></div>
      <p class="note">« Connectés » = comptes ouverts ce jour-là (code ou Face ID). Les codes sont chiffrés : personne ne peut les lire, même toi. Seuls les comptes apparaissent ici, pas les visiteurs sans compte. ✓ = e-mail confirmé par le code reçu.</p>`;
  }else{
    const max = Math.max(1, ...s.jours.map(j => j.personnes));
    h = head(`Appareils (${s.appareils.length})`, 1) + (s.appareils.length ? `<p class="note">Par année : ${parAn(s.appareils)}</p>` : "")
      + `<h2>Par jour</h2><div class="scroll"><table><tr><th>Jour</th><th>Appareils</th><th>Nouveaux</th><th style="width:40%"></th></tr>
      ${s.jours.map(j => `<tr><td>${esc(day(j.jour))}</td><td class="n">${j.personnes}</td><td class="n">${j.nouvelles}</td><td><div class="bar" style="width:${Math.round(j.personnes/max*100)}%"></div></td></tr>`).join("")}</table></div>
      <h2>Liste</h2><div class="scroll"><table><tr><th>Appareil</th><th>TP</th><th>Premier jour</th><th>Dernier jour</th><th>Jours</th></tr>
      ${s.appareils.map(a => `<tr><td>${esc(String(a.device).slice(0,8))}</td><td>${esc(tpLbl(a.tp))}</td><td>${esc(day(a.premier))}</td><td>${esc(day(a.dernier))}</td><td class="n">${a.jours}</td></tr>`).join("")}</table></div>
      <p class="note">Un appareil = un téléphone ou un navigateur. Quelqu'un qui utilise son téléphone et son PC compte pour 2.</p>`;
  }
  $("app").innerHTML = h;
}
// zoom bloqué comme dans l'appli (pincer, double-tap)
addEventListener("gesturestart", e=>e.preventDefault());
load();
</script>
</body>
</html>
