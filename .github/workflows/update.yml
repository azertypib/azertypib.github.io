name: Mise a jour EDT

on:
  schedule:
    # 1 fois par jour (l'emploi du temps change rarement) : le matin.
    # GitHub compte en heure UTC : 6h30 UTC = 7h30 a Paris l'hiver (8h30 l'ete) ; avant 7h30 l'etape Horaires bloquerait.
    - cron: '30 6 * * *'
  workflow_dispatch:          # bouton "Run workflow" pour lancer a la main (toujours autorise)

permissions:
  contents: write

concurrency:
  group: edt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Horaires (7h30 - 23h heure de Paris)
        id: horaire
        run: |
          hm=$(TZ=Europe/Paris date +%H%M)
          echo "Heure de Paris : $hm"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ $((10#$hm)) -lt 730 ] || [ $((10#$hm)) -gt 2300 ]; }; then
            echo "Hors horaires : on ne touche a rien."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Garder la base des devoirs eveillee (tous les 5 jours, le matin)
        if: steps.horaire.outputs.go == 'true'
        run: |
          jour=$((10#$(TZ=Europe/Paris date +%j)))
          heure=$((10#$(TZ=Europe/Paris date +%H)))
          if [ $((jour % 5)) -eq 0 ] && [ $heure -lt 11 ]; then
            curl -s -o /dev/null -w "Supabase : %{http_code}\n" \
              -H "apikey: sb_publishable_qHE46e33ZJ-_AFLZkXG4YA_ty7QAaXx" \
              "https://oysfbsdpdcjpufrfpmjx.supabase.co/rest/v1/devoirs?select=id&limit=1" || true
          else
            echo "Pas aujourd'hui (jour $jour)."
          fi

      - uses: actions/checkout@v4
        if: steps.horaire.outputs.go == 'true'

      - name: Recuperer l'emploi du temps sur GPU
        if: steps.horaire.outputs.go == 'true'
        shell: pwsh
        env:
          GPU_LOGIN: ${{ secrets.GPU_LOGIN }}
          GPU_PASSWORD: ${{ secrets.GPU_PASSWORD }}
        run: ./build.ps1

      - name: Publier
        if: steps.horaire.outputs.go == 'true'
        run: |
          git config user.name "edt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "maj emploi du temps" || echo "rien de nouveau"
          git push
