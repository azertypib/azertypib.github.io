name: Mise a jour EDT

on:
  schedule:
    - cron: '17 5-21 * * *'   # toutes les heures de 6h a 22h (heure de Paris, environ)
  workflow_dispatch:          # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write

concurrency:
  group: edt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer l'emploi du temps sur GPU
        shell: pwsh
        env:
          GPU_LOGIN: ${{ secrets.GPU_LOGIN }}
          GPU_PASSWORD: ${{ secrets.GPU_PASSWORD }}
        run: ./build.ps1

      - name: Publier
        run: |
          git config user.name "edt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "maj emploi du temps" || echo "rien de nouveau"
          git push
