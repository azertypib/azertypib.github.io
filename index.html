<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EDT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EDT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141312">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png?l">
<link rel="icon" type="image/png" href="icon.png?l">
<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d1b18; --muted:#77716a; --line:#e6e1da; --soft:#efebe5;
  --accent:#e0533d; --ok:#2f9e5b; --todo:#e08a1e; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
  --hour:56px; --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
:root[data-theme=dark]{
  --bg:#141312; --panel:#1d1c1a; --ink:#f1ede7; --muted:#9a948c; --line:#2d2b28; --soft:#262422; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:calc(14px + var(--top)) 12px calc(40px + var(--bot))}

/* ---------- en-tete ---------- */
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
/* marque : bandeau (logo EDT + texte) en fondu bleu nuit -> canard ; les carres gardent leur style normal */
.ban{flex:1 1 auto;min-width:0;height:48px;margin-right:6px;border-radius:12px;padding:0 12px 0 0;display:flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(90deg,#0d2a47 0%,#0d2a47 30%,#12808a 100%);box-shadow:var(--shadow);overflow:hidden}
.ban .lg{flex:none;height:100%;aspect-ratio:1;border-radius:12px 0 0 12px;display:block;-webkit-mask-image:linear-gradient(90deg,#000 62%,transparent 100%);mask-image:linear-gradient(90deg,#000 62%,transparent 100%)}
.ban .bars{display:flex;align-items:flex-end;gap:2.5px;height:16px}.ban .bars i{display:block;width:5px;border-radius:2px;height:16px;background:#2e86d4}.ban .bars i:nth-child(2){height:10px;background:#12808a}.ban .bars i:nth-child(3){background:#2fbf6a}
.ban .tel{display:flex;flex-direction:column;line-height:1.1;min-width:0}.ban .tel b{font-size:15px;font-weight:800}.ban .tel span{font-size:11.5px;font-weight:600;color:#d6e6f5;white-space:nowrap}
.ban .pc{display:none}.ban .bars.pc{display:none}
.ban .bt{font-size:16px;font-weight:600;color:#d6e6f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;align-items:baseline;gap:5px}.ban .bt b{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.02em}
.ban em{margin-left:auto;font-style:normal;font-size:13px;font-weight:600;color:#eafaf0;white-space:nowrap}
@media (min-width:760px){ .ban{padding:0 16px;gap:12px} .ban .tel,.ban .lg{display:none} .ban .bars{height:24px} .ban .bars i{width:6px;height:24px} .ban .bars i:nth-child(2){height:15px} .ban .pc{display:block} .ban .pc.bt,.ban .bars.pc{display:flex} }
/* cartouche semaine (a gauche) : on le touche pour choisir une date ; le champ date invisible le recouvre */
.ttl{position:relative;flex:0 1 auto;min-width:0;text-align:left;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 14px;height:var(--h2);display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.ttl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.ttl h1{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.15}
.ttl div{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:650;font-size:14px}
.bar{display:flex;gap:6px;align-items:stretch;margin-bottom:10px;--h2:54px}   /* 2e ligne : 4 cartouches alignés haut et bas, un peu plus hauts que la 1re (48) */
.btn{border:1px solid var(--line);background:var(--panel);height:36px;min-width:36px;padding:0 12px;border-radius:10px;font-weight:600}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* bandeau du bas : Moodle + Messagerie (un cartouche coloré, sans trait, calé à gauche) et ENT sans couleur à droite ; PC : ENT va du carré Discussion au carré du groupe, Moodle/Messagerie = 2 fois sa largeur (fitLinks) */
.links{display:flex;gap:8px;height:46px;margin:10px 0 14px}
.links .lk{flex:none;width:var(--lkw,auto);min-width:0;display:flex;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#0d2a47 0%,#0d2a47 30%,#12808a 100%);box-shadow:var(--shadow)}
.links a{display:grid;place-items:center;text-decoration:none;font-size:15px;font-weight:700}
.links .lk a{flex:1;padding:0 18px;color:#fff}
.links .lk a:hover,.links .lk a:focus-visible{background:rgba(255,255,255,.08)}
.links .shr{flex:none;width:var(--shw,48px);display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:0}
@media (max-width:759px){ .links{height:var(--shw,42px);gap:var(--hgap,6px)} .links .lk{flex:1 1 auto} .links .ent{flex:1 1 auto !important;margin-left:0 !important} }
.links .ent{margin-left:auto;flex:none;width:var(--entw,auto);padding:0 18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow)}
.bar .nav{width:44px;height:var(--h2);padding:0;display:grid;place-items:center;border-radius:12px;box-shadow:var(--shadow)}
.ttl{cursor:pointer}
.seg{position:relative;display:inline-grid;font:inherit;color:inherit;grid-template-columns:auto auto;border:1px solid var(--line);border-radius:12px;padding:2px;height:var(--h2);margin-left:auto;background:var(--panel);cursor:pointer;box-shadow:var(--shadow)}
.seg::before{content:"";position:absolute;top:2px;bottom:2px;left:0;width:var(--w,0);transform:translateX(var(--x,2px));border-radius:10px;background:linear-gradient(90deg,#0d2a47,#12808a);box-shadow:0 1px 4px rgba(0,0,0,.25);}   /* pastille calée sur le mot actif (seatSeg) */
.seg.ready::before{transition:transform .22s ease,width .22s ease}   /* pas d'animation au premier affichage */
.bar button.nav:nth-of-type(2){margin-right:8px}   /* petit espace entre la flèche et l'interrupteur */
.seg span{position:relative;z-index:1;display:grid;place-items:center;padding:0 14px;font-weight:600;color:var(--muted);transition:color .22s}
.seg span.on{color:#fff}

.sq{position:relative;width:48px;height:48px;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;
  font-size:19px;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sq small{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.sq .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ttl h1{white-space:nowrap}
@media (max-width:420px){ header{gap:6px} .sq{width:42px;height:42px} .ban{height:42px;margin-right:2px;gap:1px;padding:0 14px 0 0} .ban .tel b{font-size:13.5px} .ban .tel span{font-size:10.5px} .bar{gap:5px;--h2:48px} .bar .nav{width:34px} .links{height:42px} .ttl h1{font-size:17px} .ttl div{font-size:11.5px} .seg span{padding:0 8px} }

/* ---------- grille semaine ---------- */
.grid{display:grid;grid-template-columns:30px repeat(var(--days),1fr);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dh{padding:8px 4px;text-align:center;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.dh b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dh span{font-size:17px;font-weight:700}
/* vue Semaine : la journee d'aujourd'hui est juste encadree d'un trait fin, de haut en bas */
/* trait par-dessus (::after) : 1 px a l'ecran normal, 1 pixel physique sur ecran dense ou zoome (jamais arrondi a 0) */
.col.done .ev{opacity:.5}   /* journée finie (après 18h ou jour passé) : grisée */
/* telephone : pas de zoom (double toucher, champs < 16 px qui font zoomer iOS) */
html{touch-action:manipulation}
@media (max-width:759px){ input,textarea,select{font-size:16px} }
.corner{border-bottom:1px solid var(--line)}
.times{position:relative}
.times div{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
/* cartouche de cours facon demo D : fond teinte du module, trait de couleur a gauche, heure / module / salle */
.ev{position:absolute;left:2px;right:2px;border-radius:10px;padding:5px 6px;overflow:hidden;cursor:pointer;
  background:var(--bgc);color:var(--fg);border-left:4px solid var(--c);font-size:11px;line-height:1.25}
.ev .tm{font-size:10.5px;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .te{display:none}
.ev .t{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .x{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.exam{box-shadow:inset 0 0 0 2px var(--c)}
.dpanel.done .dc,.dpanel.done .sm{opacity:.5}
.dc.past,.sm.past,.col .ev.past{opacity:.5}   /* cours déjà fini (au-dessus du trait de l'heure) */
.dpanel:not(.on),.wpanel:not(.on){cursor:pointer}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* pastille devoir */
.hw{position:absolute;right:7px;bottom:7px;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff}
.hw svg{width:12px;height:12px;display:block}
.hw.todo{background:#e0392f} .hw.ok{background:#2fbf6a}
.ev .hw{right:3px;bottom:3px;width:15px;height:15px;border-radius:4px}
.ev .hw svg{width:10px;height:10px}
.tabs .hw{position:static;display:inline-grid;vertical-align:-3px;width:16px;height:16px;margin-right:3px}
.badge{font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--c);color:#fff;vertical-align:1px}

/* ---------- vue jour ---------- */
.days{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.days button{flex:1;min-width:54px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 0;text-align:center}
.days button b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.days button span{font-size:18px;font-weight:700}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .days button.on b{color:var(--bg)}
.days button.today span{color:var(--accent)} .days button.on.today span{color:var(--bg)}
/* vue Jour : un grand cadre translucide par jour sur une bande ; le jour choisi a gauche (4/5), le suivant en resume tres transparent ; on glisse au doigt */
.dview{overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dtrack{--pw:82%;--dx:0px;display:flex;gap:12px;align-items:flex-start;transform:translateX(calc(var(--i) * (-1 * var(--pw) - 12px) + var(--dx)));transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.dtrack.drag{transition:none}
/* --o = 1 pour le jour/la semaine affiche, 0 pour les voisins ; en glissant il passe progressivement de l'un a l'autre */
.dtrack>*{flex:none;width:var(--pw);opacity:calc(.35 + .65 * var(--o,0));transition:opacity .38s}
.dtrack.drag>*,.dtrack.drag .full,.dtrack.drag .sum{transition:none}
.wview .dtrack{--pw:100%}
.dpanel{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--line);border-radius:20px;padding:12px 12px 14px;min-height:var(--ph,0)}
.dpanel h3{margin:0 0 10px 2px;font-size:16px}.dpanel h3 span{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:6px}
/* detail et resume l'un sur l'autre : fondu croise pendant le glisser */
/* journee a echelle fixe : cours et pauses places a leur heure (position absolue) */
.dbody{position:relative}.dbody>.full,.dbody>.sum{position:absolute;inset:0;transition:opacity .38s}
.dbody>.full>*,.dbody>.sum>*{position:absolute;left:0;right:0}
.dbody>.empty{padding-top:40px}
/* cartes courtes : 2 lignes (s2) ou une seule ligne (s1) */
.dc.s2 .nm{display:none}
.dc.s1{flex-direction:row;align-items:center;gap:8px;padding:0 11px}.dc.s1 .cd{font-size:14px;margin:0}.dc.s1 .badge,.dc.s1 .nm{display:none}.dc.s1 .rm{top:50%;transform:translateY(-50%);font-size:13px}.dc.s1 .hw{bottom:auto;top:calc(50% - 9px);right:auto;left:auto;position:static;margin-left:auto}.dc.s1:has(.hw) .rm{right:36px}
.sm.s1{flex-direction:row;align-items:center;gap:6px;padding:0 11px}
/* fondu croise : le resume s'efface pendant que le detail apparait (jamais de passage au noir) */
.dbody>.full{opacity:clamp(0, calc((var(--o,0) - .2) / .6), 1)}.dbody>.sum{opacity:clamp(0, calc((.8 - var(--o,0)) / .6), 1);pointer-events:none}
.dtrack>:not(.on) .full{pointer-events:none}
/* carte de cours : heure en haut a gauche, salle en gros a droite, module au milieu, nom en bas */
.dc{position:relative;display:flex;flex-direction:column;justify-content:flex-start;background:var(--bgc);color:var(--fg);border-radius:14px;padding:9px 11px 10px;border-left:4px solid var(--c);cursor:pointer;overflow:hidden}
.dc .tm{font-size:12px;font-weight:700;opacity:.85}
.dc .rm{position:absolute;right:11px;top:9px;font-size:15px;font-weight:800}
.dc .cd{font-size:16px;font-weight:700;margin-top:1px}.dc .cd .badge{vertical-align:2px;margin-left:4px}
.dc .nm{font-size:12.5px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .hw{right:10px;bottom:8px}
/* pauses : 15 min = un pointille ; dejeuner = deux pointilles avec les heures entre ; debut / fin de journee */
.dash{height:14px;display:flex;align-items:center}.dash::before{content:"";flex:1;border-top:2px dashed color-mix(in srgb,var(--muted) 50%,transparent)}
.brk{display:flex;flex-direction:column;justify-content:space-between;padding:3px 0}
.brk i{display:block;border-top:2px dashed color-mix(in srgb,var(--muted) 50%,transparent)}
.brk span{text-align:center;font-size:12px;line-height:14px;font-weight:700;color:var(--muted)}
.brk.lead{justify-content:flex-end;gap:7px}.brk.tail{justify-content:flex-start;gap:7px}
/* resume du jour voisin : seulement l'heure de debut et le module */
.sm{display:flex;flex-direction:column;justify-content:flex-start;font-size:15px;font-weight:700;padding:9px 11px;border-radius:14px;background:var(--bgc);color:var(--fg);border-left:4px solid var(--c);overflow:hidden}.sm b{font-size:12px;opacity:.85}
.sp{display:block}
@media (min-width:760px){ .dtrack{--pw:64%} }
@media (prefers-reduced-motion:reduce){ .dtrack,.dtrack>*,.dbody>*{transition:none} }
.card{position:relative;display:flex;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:5px solid var(--c);cursor:pointer}
.card .hrs{font-variant-numeric:tabular-nums;font-weight:700;min-width:50px}
.card .hrs span{display:block;color:var(--muted);font-weight:500}
.card .t{font-weight:800}
.card .n{color:var(--muted);font-size:13.5px}
.card .m{font-size:13.5px;margin-top:2px}
.card .memo{font-size:13px;margin-top:4px;color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-style:italic;padding:14px 4px}
.vide{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:20px 12px}
.vide svg{width:86px;height:70px;margin-bottom:12px}.vide b{font-size:19px}.vide span{color:var(--muted);font-size:14px}
.dbody>.vide{height:100%}.wvide{position:relative}.wvide>.vide{position:absolute;inset:44px 0 0 0;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.gap{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px 14px;margin:0 0 8px;color:var(--muted);font-weight:700;font-size:14px}
.gap span{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- annonces ---------- */
.ann{margin-bottom:12px}
.ann .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ann .head b{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ann .head button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:650;font-size:13px}
.sq.vide{visibility:hidden}
.chrono{margin-top:10px;height:46px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0d2a47;color:#fff;border:1px solid #1d4a75;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.chrono .bars{display:flex;align-items:flex-end;gap:3px;height:20px;flex:none}.chrono .bars i{width:6px;border-radius:2px;height:14px;background:#2e86d4}.chrono .bars i:nth-child(2){height:9px;background:#12808a}.chrono .bars i:nth-child(3){background:#2fbf6a}
.chrono .lbl{display:flex;flex-direction:column;line-height:1.15;min-width:0}.chrono .lbl b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chrono .lbl small{font-size:11.5px;opacity:.8;white-space:nowrap}
.chrono .t{margin-left:auto;font-weight:800;font-size:19px;white-space:nowrap}.chrono .t em{font-style:normal;font-size:12px;font-weight:600;opacity:.7;margin:0 5px 0 1px}.chrono .t em:last-child{margin-right:0}
@media (min-width:760px){ .chrono{height:52px;padding:0 16px} .chrono .lbl b{font-size:15px} .chrono .t{font-size:21px} }
.chatann{margin:0 0 10px}.chatann .annbox{margin:0}.chatann .annbox .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chatann .tout{display:block;text-align:right;font-size:12.5px;color:var(--muted);margin:5px 2px 0}
.chatsep{border:0;border-top:1px solid var(--line);margin:4px 0 12px}
.annbox{display:flex;gap:12px;background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer}
.annbox .d{font-weight:800;min-width:62px;font-size:13px;line-height:1.25}
.annbox .d span{display:block;color:var(--muted);font-weight:600}
.annbox .tx{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.annck{flex:none;align-self:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:#fff;cursor:pointer;padding:0}
.annck svg{width:16px;height:16px}
.annck.on{background:#2fbf6a;border-color:#2fbf6a}
.annbox.seen{opacity:.55}
.chathead{display:flex;flex-direction:column;margin-bottom:8px}.chathead b{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.chathead small{color:var(--muted);font-size:12px}
.chattabs{display:flex;gap:6px;margin-bottom:8px}
.chattabs button{position:relative;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;height:38px;font-weight:700;font-size:14px;cursor:pointer}
.chattabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chattabs .cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.chatlist{height:42vh;overflow-y:auto;background:var(--soft);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;align-self:flex-start;background:var(--panel);border-radius:12px 12px 12px 4px;padding:6px 10px;box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-radius:12px 12px 4px 12px}
.msg .who{font-size:12px;font-weight:700}.msg .who span{font-weight:500;opacity:.65}
.msg .tx{font-size:14.5px;white-space:pre-wrap;word-break:break-word}

<div id="warn" role="alertdialog" aria-modal="true" aria-labelledby="warnh"><div><h3 id="warnh">Attention</h3>

const $ = id => document.getElementById(id);

function monday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }

const ICON_CHAT = svg('<path d="M21 11.5a8.4 8.4 0 0 1-12.2 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"/><path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01" stroke-width="3"/>');

const ICO_PEN = `<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TI = { hw:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>', ds:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  room:'<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M14 12h.01"/>', hours:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>' };

const ICON_NEXT = svg('<path d="m9 5 7 7-7 7"/>');
let theme = store.get("theme", matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
function applyTheme(){ document.documentElement.dataset.theme = theme; document.querySelector('meta[name="theme-color"]').content = theme==="dark" ? "#141312" : "#f4f2ee"; }
function toggleTheme(){ theme = theme==="dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(); render(); }
applyTheme();

/* ======== couleurs par matiere ======== */
const PALETTE=[8,200,145,280,35,330,175,240,95,15,260,55,120,300];
const hue={};
function colors(code){
  if(!(code in hue)){ let h=0; for(const ch of code) h=(h*31+ch.charCodeAt(0))>>>0; hue[code]=PALETTE[h%PALETTE.length]; }
  const h=hue[code], dark=theme==="dark";
  // couleurs des maquettes (Graphite vif) : fond plein du module, plus lumineux
  return dark ? `--c:hsl(${h} 62% 50%);--bgc:hsl(${h} 45% 25%);--fg:hsl(${h} 40% 95%)`
              : `--c:hsl(${h} 62% 50%);--bgc:hsl(${h} 85% 90%);--fg:hsl(${h} 40% 20%)`;
}

/* ======== donnees ======== */
function events(){
  if(!DATA || !tp || !DATA.events[tp]) return [];
  return DATA.events[tp].map(e=>({...e, s:new Date(e.start), e:new Date(e.end), key:e.code+"|"+e.start, name:DATA.names?.[e.code]||""}));
}
// Pages garde la page 10 min en cache : on compare avec la version en ligne et on recharge si elle a change.
const APP_V = "2026-11-26k";
async function checkUpdate(){
  try{
    const t = await (await fetch(location.pathname+"?check="+Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/const APP_V = "([^"]+)"/)||[])[1];
    if(v && v!==APP_V) location.replace(location.pathname+"?v="+v);
  }catch{}
}
async function loadData(){
  checkUpdate();
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    RAW = await r.json(); store.set("data", RAW); DATA = yearData();
  }catch{ if(!DATA) toast("Pas de connexion"); }
  render();
}

/* ======== devoirs (Supabase REST) ======== */
const HW_ON = !!(SUPA_URL && SUPA_KEY);
function hdr(extra){ const h={apikey:SUPA_KEY,"Content-Type":"application/json",...extra}; if(!SUPA_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPA_KEY; return h; }
async function loadHw(){
  if(!HW_ON || !tp) return;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/devoirs?tp=in.(${audiences().map(encodeURIComponent).join(",")})&deleted=is.false&due=gte.${encodeURIComponent(dayStart().toISOString())}&order=due.asc,created_at.asc`, {headers:hdr()});
    if(!r.ok) throw 0;
    homework = await r.json(); store.set("hw", homework); render(); if(sheetKey) openSheet(sheetKey,true);
  }catch{}
}
async function addHw(ev, texte){
  if(!canWrite()) return;
  // le devoir va au public du cours selon GPU : S1 = promo, S1A = groupe de TD, S1TP1 = TP seul
  const who = audiences().includes(ev.group) ? ev.group : tp;
  const body={tp:who, ckey:ev.key, code:ev.code, due:ev.start, texte:clean(texte,"devoir")};
  const r = await fetch(`${SUPA_URL}/rest/v1/devoirs`, {method:"POST", headers:hdr({Prefer:"return=representation"}), body:JSON.stringify(body)});
  if(!r.ok){ toast("Erreur : devoir non enregistré"); return; }
  toast("Devoir ajouté pour "+audLabel(who)); await loadHw();
}
async function patchHw(id, fields, msg){
  if(!canWrite()) return;
  if(fields.texte) fields.texte = clean(fields.texte, "devoir modifié");
  const r = await fetch(`${SUPA_URL}/rest/v1/devoirs?id=eq.${id}`, {method:"PATCH", headers:hdr(), body:JSON.stringify({...fields, updated_at:new Date().toISOString()})});
  if(!r.ok){ toast("Erreur : modification non enregistrée"); return; }
  if(msg) toast(msg); await loadHw();
}
// un devoir reste affiché 7 jours après sa date de rendu, puis disparait (il reste en base, mais n'est plus affiché ni téléchargé)
const dayStart = () => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-7); return d; };   // minuit, il y a 7 jours
const hwLive = () => homework.filter(h=>new Date(h.due)>=dayStart());
const hwFor = key => hwLive().filter(h=>h.ckey===key);
// coche et croix dessinees (pas de caracteres unicode, qui ressemblent a des emojis)
const ICO_OK = `<svg viewBox="0 0 12 12"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICO_X  = `<svg viewBox="0 0 12 12"><path d="M3.2 3.2l5.6 5.6M8.8 3.2l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`;
function hwBadge(key){
  const l = hwFor(key); if(!l.length) return "";
  const ok = l.every(h=>done[h.id]);
  return `<span class="hw ${ok?"ok":"todo"}" title="${ok?"Devoir fait":"Devoir à faire"}">${ok?ICO_OK:ICO_X}</span>`;
}
// note perso sur un cours (visible par soi seul ; suit le compte)
let notes = store.get("notes", {});
const noteBadge = key => notes[key] ? `<span class="hw me${hwFor(key).length?" sh":""}" title="Ma note">${ICO_PEN}</span>` : "";
function saveNote(v){ if(!sheetKey) return; v = v.trim().slice(0, 1000); if(v) notes[sheetKey] = v; else delete notes[sheetKey]; store.set("notes", notes); }
function setCourseDone(v){ hwFor(sheetKey).forEach(x=>{ if(v) done[x.id]=true; else delete done[x.id]; }); store.set("done", done); render(); openSheet(sheetKey,true); }
function toggleDone(id, v){ if(v) done[id]=true; else delete done[id]; store.set("done", done); render(); if(sheetKey) openSheet(sheetKey,true); }

/* ======== groupes ======== */
const tdLabel = g => "Groupe " + g.replace(/^S\d/,"");
const tpLabel = g => g.replace(/^S\d/,"");
let PROMO = annee || "S1";   // la promo = l'année choisie (S1, S3) : devoirs et discussion restent dans l'année ; annonces, messages au créateur et dons sont communs
// publics dont on voit les devoirs : la promo, son groupe de TD, son TP
const audiences = () => [PROMO, tdOf(tp), tp].filter(Boolean);
const audLabel = g => g==="IUT" ? "tout l'IUT" : g===PROMO ? "toute la promo" : /TP/.test(g) ? "le "+tpLabel(g) : "tout le groupe "+tpLabel(g);
function tdOf(t){ for(const [td,l] of Object.entries(DATA?.groups||{})) if(l.includes(t)) return td; return ""; }

/* ======== rendu ======== */
function render(){
  now = new Date();
  const app = $("app");
  if(ferme){ app.dataset.cv = ""; app.innerHTML = `<div class="pick"><img src="icon.png" width="72" style="border-radius:16px" alt=""><h1>Application fermée</h1><p>L'emploi du temps n'est pas disponible pour le moment. Reviens un peu plus tard.</p></div>`; return; }
  // compte : appareil connecté mais appli rouverte = code ; jamais choisi = accueil (créer / se connecter / sans compte)
  if(cpt && !cptOuvert() && !["connexion","inscription","bloque","accueil"].includes(cptVue)) cptVue = "verrou";
  if(!cpt && !store.get("sansCompte") && !cptVue) cptVue = "accueil";
  const vueCpt = () => { if(app.dataset.cv===cptVue) return; app.dataset.cv = cptVue; renderCpt(); };   // pas de redessin pendant la saisie
  if(cptVue) return vueCpt();
  // charte : avec compte = signée une fois par compte (suit le compte sur tous les appareils) ; sans compte = une fois par appareil
  if(cpt ? !store.get("charteCpt") : !charteOk()){ app.dataset.cv = ""; return renderWelcome(); }
  app.dataset.cv = "";
  if(!RAW){ app.innerHTML = `<div class="pick"><img src="icon.png" width="72" style="border-radius:16px"><h1>Chargement…</h1></div>`; return; }
  if(!annee || pickYear) return renderYear();
  if(!DATA) return renderYear("L'emploi du temps de cette année n'est pas encore disponible.");
  if(!tp || !DATA.events[tp] || pickStep){ renderPick(); return; }
  track(false);   // une fois par jour et par appareil, TP connu

  const all = events(); ALLEV = all;
  const end = new Date(week); end.setDate(end.getDate()+7);
  const wk = all.filter(e=>e.s>=week && e.s<end);
  const nDays = wk.some(e=>e.s.getDay()===6) ? 6 : 5;
  const last = new Date(week); last.setDate(last.getDate()+nDays-1);

  // ligne du haut = fonctionnalites ; ligne 2 = cartouche semaine (choix de date) a gauche, Jour/Semaine a droite
  const curD = new Date(week); if(view==="jour") curD.setDate(curD.getDate()+Math.min(dayIdx,nDays-1));
  const sub = view==="jour" ? fmtD(curD,{weekday:"short",day:"numeric",month:"short"})
                            : fmtD(week,{day:"numeric",month:"short"})+" – "+fmtD(last,{day:"numeric",month:"short"});
  let h = `<header>
      <div class="ban"><img class="lg" src="icon.png?l" alt="EDT"><div class="bars pc"><i></i><i></i><i></i></div>
        <div class="tel"><b>IUT</b><span>La Rochelle</span></div>
        <div class="pc bt"><b>EDT</b><span>· Emploi du temps · IUT La Rochelle</span></div><em class="pc">Génie civil · ${esc(PROMO)}</em></div>
      ${HW_ON?`<span class="sq vide" aria-hidden="true"></span>`:""}
      ${HW_ON?`<button class="sq" onclick="openFeedback()" aria-label="Messages au créateur">${ICON_MSG}${retNew()?`<span class="cnt">${retNew()}</span>`:""}</button>`:""}
      <button class="sq" onclick="openParams()" aria-label="Paramètres">${ICON_GEAR}</button>
      ${HW_ON?`<button class="sq" onclick="openChat()" aria-label="Annonces et discussion">${ICON_CHAT}${chatBadges()}</button>`:""}
      <button class="sq" onclick="startPick()" aria-label="Changer de groupe">${esc(tdLabel(tdOf(tp)).replace("Groupe ",""))}<small>${esc(tpLabel(tp))}</small></button>
    </header>
    <div class="bar">
      <button class="btn nav" onclick="step(-1)" aria-label="Précédent">${ICON_PREV}</button>
      <label class="ttl" title="Choisir une date"><h1>Semaine ${isoWeek(week)}</h1><div>${sub}</div>
        <input type="date" aria-label="Choisir une date" value="${ymd(curD)}" min="${ymd(minWeek())}" onclick="try{this.showPicker()}catch{}" onchange="jumpDate(this.value)"></label>
      <button class="btn nav" onclick="step(1)" aria-label="Suivant">${ICON_NEXT}</button>
      <button class="seg ${view==="semaine"?"sem":""}" onclick="toggleView(this)" role="switch" aria-checked="${view==="semaine"}" aria-label="Vue Jour ou Semaine"><span class="${view==="jour"?"on":""}">Jour</span><span class="${view==="semaine"?"on":""}">Semaine</span></button>
    </div>`;

  h += view==="semaine" ? renderWeek(all) : renderDay(all);
  h += chronoBande();   // chrono des vacances : entre l'emploi du temps et les liens
  // liens de l'université sous l'emploi du temps (téléphone : collés au bas de l'écran, voir fitH)
  h += `<nav class="links" aria-label="Liens de l'université"><div class="lk"><a href="${LINKS.moodle}" target="_blank" rel="noopener">Moodle</a><a href="${LINKS.mail}" target="_blank" rel="noopener">Messagerie</a></div><a class="ent" href="${LINKS.ent}" target="_blank" rel="noopener">ENT</a><button class="shr" onclick="shareLink()" aria-label="Partager l'appli">${ICON_SHARE}</button></nav>`;
  h += renderTiles(all);
  h += `<footer><span>${DATA.updated?"Emploi du temps vérifié le "+fmtD(new Date(DATA.updated),{day:"numeric",month:"short"})+" à "+fmtH(new Date(DATA.updated)):""}</span>
</footer>`;
  app.innerHTML = h; bindSwipe(); seatSeg(document.querySelector(".seg")); fitLinks();
  // telephone : on mesure ou commence la bande puis on redessine une fois pour qu'elle finisse pile en bas de l'ecran
  const tr=$("dtrack");
  if(tr && phone() && !render.fit){ const t=Math.round(tr.getBoundingClientRect().top+scrollY);
    if(Math.abs(t-fitTop)>2){ fitTop=t; render.fit=1; render(); render.fit=0; } }
}

// la bande contient la semaine precedente (si permise), la courante et la suivante
function weekSpan(all, w){ const e=new Date(w); e.setDate(e.getDate()+7); const wk=all.filter(x=>x.s>=w && x.s<e); return {w, wk, n: wk.some(x=>x.s.getDay()===6)?6:5}; }
function nearWeeks(all){ const out=[]; for(const k of [-1,0,1]){ const w=new Date(week); w.setDate(w.getDate()+7*k); if(w>=minWeek()) out.push(weekSpan(all,w)); } return out; }
let SLOTS=[], fitTop=170, dayFit=0;
const phone = () => innerWidth < 760;
const fitH = () => Math.max(320, innerHeight - fitTop - 28 - 52 - (chrono() ? 56 : 0));   // petite marge en bas (+ barre de l'iPhone) + bandeau de liens (42 + 10)

function renderWeek(all){
  const W=nearWeeks(all); let h0=8,h1=18;
  W.forEach(x=>x.wk.forEach(e=>{ h0=Math.min(h0,e.s.getHours()); h1=Math.max(h1,Math.ceil(e.e.getHours()+e.e.getMinutes()/60)); }));
  let H=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  if(phone()) H=Math.max(36, Math.floor((fitH()-52)/(h1-h0)));
  SLOTS=W.map(x=>({w:x.w, i:dayIdx}));
  const ci=W.findIndex(x=>+x.w===+week);
  return `<div class="dview wview" id="dview"><div class="dtrack" id="dtrack" style="--i:${ci}">`
    + W.map((x,k)=>`<div class="wpanel ${k===ci?"on":""}" style="--o:${k===ci?1:0}">${weekGrid(x.w,x.wk,x.n,h0,h1,H)}</div>`).join("") + `</div></div>`;
}
function weekGrid(week, wk, nDays, h0, h1, H){
  const top=d=>((d.getHours()+d.getMinutes()/60)-h0)*H;
  let h=`<div class="grid" style="--days:${nDays};--hour:${H}px"><div class="corner"></div>`;
  for(let i=0;i<nDays;i++){ const d=new Date(week); d.setDate(d.getDate()+i);
    h+=`<div class="dh ${sameDay(d,now)?"today":""}"><b>${DAYS[i].slice(0,3)}</b><span>${d.getDate()}</span></div>`; }
  h+=`<div class="times" style="height:${(h1-h0)*H}px">`;

// echelle universelle : 8h-12h15 = B px, 12h15-13h45 = L px (midi tasse), 13h45-18h = B px (symetrique du matin)
const dayY = (t, B, L) => { const m=t.getHours()*60+t.getMinutes();

function dayList(d, de, Hc, B, L){

  // écart entre deux cours : "brk" = vraie pause (horaires affichés), "recre" = 15-25 min (petit trait, écart serré pour ne pas ressembler à midi)
  const kind=(a,b)=>{ const g=(b-a)/6e4, px=Y(b)-Y(a); return g>25 && (px>=34 || px>=L) ? "brk" : g>=15 ? "recre" : ""; };

  de.forEach((e,i)=>{

        <div class="cd">${esc(e.code)}${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""}</div>
        <div class="nm">${esc(e.name)}${e.prof?` · ${esc(e.prof)}`:""}</div>${noteBadge(e.key)}${hwBadge(e.key)}</div>`;

    sum+=`<div class="sm ${hh<44?"s1":""}${e.e<=now?" past":""}" style="top:${y}px;height:${hh}px;${colors(e.code)}"><b>${fmtH(e.s)}</b>${esc(e.code)}</div>`;
    prev = end;

  if(mins(prev)<=1040){ const y=Y(prev); full+=`<div class="brk tail" style="top:${y}px;height:${H-y}px"><i></i><span>Fin des cours à ${fmtH(prev)}</span></div>`; }

  return `<div class="dbody" style="height:${H}px"><div class="full">${full}</div><div class="sum">${sum}</div></div>`;
}

function sallesLibres(){

// cours proposes selon le public : TP = tout son emploi du temps, groupe = ses cours de groupe (TD), promo = ses cours communs (amphi, DS...)
function annCourses(g){
  const seen = {}, out = [], nowT = Date.now();
  for(const [t, evs] of Object.entries(DATA?.events||{})){
    if(PROMO!==g && t!==g && !(DATA.groups?.[g]||[]).includes(t)) continue;
    for(const e of evs){
      if(t!==g && e.group!==g) continue;
      const key = e.code+"|"+e.start;
      if(seen[key] || new Date(e.end) < nowT) continue;
      seen[key] = 1; out.push({...e, key});
    }
  }
  return out.sort((a,b)=>a.start<b.start?-1:1);
}

// pas de préfixes trop courts : batardeau, salopette, branlant, niquel, cul-de-sac sont des mots normaux
const BAD_W = new Set(("con cons conne connes pd pds fdp ntm tg ptn nique niquer niquez niques bite bites chatte merde merdes putain putains pute putes "+
  "salope salopes salaud salauds salopard batard batards batarde enfoire enfoires encule encules bouffon bouffons abruti abrutis abrutie "+
  "debile debiles cretin cretins cretine imbecile imbeciles gogol gogols mongol triso chier chiant chiante chiasse foutre suce teub zob "+
  "tapette tapettes gouine gouines tafiole fiotte negro negros negre negres bougnoule youpin bicot branleur branleurs branlette pouffiasse petasse "+
  "fuck fucking shit bitch bitches dick cunt whore asshole nigga nigger").split(" "));
const BAD_P = ["connard","connass","encul","enfoir","putain","merde","merdi","fuck","bitch","couill","bougnoul","pouffias","petass","trouducul"];
const LEET = {0:"o",1:"i",3:"e",4:"a",5:"s",7:"t","@":"a","$":"s"};
const isBad = n => BAD_W.has(n) || BAD_P.some(p=>n.startsWith(p));
function rude(w){
  const n = w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[013457@$]/g,c=>LEET[c]);
  return isBad(n) || isBad(n.replace(/(.)\1{2,}/g,"$1")) || isBad(n.replace(/(.)\1{2,}/g,"$1$1"));   // merdeeee, connnnard
}
// liens autorisés : l'université (ENT, Moodle, IUT…), le gouvernement et des sites du bâtiment ; même liste côté serveur (public.filtre_texte)
const OK_HOSTS = ["univ-lr.fr","univ-larochelle.fr","gouv.fr","cerema.fr","cstb.fr","afnor.org","ademe.fr","ffbatiment.fr","batiweb.com","lemoniteur.fr","qualiteconstruction.com","azertypib.github.io"];
const LINK = /\b(?:https?:\/\/|www\.)\S+|\b(?:[a-z0-9-]+\.)+(?:com|fr|net|org|io|ly|gg|xyz|be|tv|app|link|info|ru|cn|site|shop|top|online|eu|uk)\b(?:\/\S*)?/gi;
function linkOk(l){
  const host = l.replace(/^https?:\/\//i,"").split(/[/?#:]/)[0].toLowerCase();
  return OK_HOSTS.some(h => host===h || host.endsWith("."+h));
}
function clean(s, lieu){
  if(!s) return s; let rudeW = false, link = false;
  const out = s.replace(LINK, l => linkOk(l) ? l : (link=true, "[lien retiré]"))
               .replace(/[\p{L}\p{N}@$]+/gu, w => rude(w) ? (rudeW=true, "*".repeat(w.length)) : w);
  if(rudeW || link){
    $("warnp").textContent = (rudeW && link ? "Ton message contenait des mots vulgaires et un lien sans rapport avec l'IUT ou le bâtiment : ils ont été retirés."
      : rudeW ? "Ton message contenait des mots vulgaires ou insultants : ils ont été remplacés par des étoiles. Arrête ça tout de suite, ce n'est pas bien."
      : "Ton message contenait un lien sans rapport avec l'IUT ou le bâtiment : il a été retiré.")

// Au lacher elle finit de glisser ; on peut enchainer les glisser sans attendre. On ne redessine (recentrage) qu'une fois le doigt au repos.
let swipe=null, swiped=false, recentre=0;
const setO = (P, pos) => P.forEach((p,k)=>p.style.setProperty("--o", Math.max(0, 1-Math.abs(k-pos)).toFixed(3)));

}
function slideTo(k){
  const t=$("dtrack"); if(!t) return;
  const P=[...t.children], cur=+t.style.getPropertyValue("--i");
  if(k<0 || k>=P.length) k=cur;
  t.classList.remove("drag"); t.style.setProperty("--dx","0px"); t.style.setProperty("--i", k);
  setO(P, k); P.forEach((p,j)=>p.classList.toggle("on", j===k));
  const s=SLOTS[k]; week=new Date(s.w); dayIdx=s.i; setTitle(s);
  const hr=document.querySelector(".tl.hrs");   // cartouche Heures : suit tout de suite la semaine affichée
  if(hr){ hr.querySelector(".st").textContent=hLbl(); hr.querySelector(".num").textContent=hFmt(heuresSemaine(events()).reduce((a,x)=>a+x[1],0)); }
  clearTimeout(recentre); if(String(k)!==t.dataset.i0) recentre=setTimeout(()=>{ if(!swipe) render(); }, 700);
}
function bindSwipe(){
  const v=$("dview"), t=$("dtrack"); if(!v || !t) return;
  const P=[...t.children]; t.dataset.i0=t.style.getPropertyValue("--i");
  const start=(x,y)=>{ clearTimeout(recentre);
    const cur=+t.style.getPropertyValue("--i");
    // si la bande est encore en train de glisser, on repart de la ou elle est (pas de saut)
    const m=new DOMMatrix(getComputedStyle(t).transform), base=m.m41 + (P[cur].offsetLeft - P[0].offsetLeft);
    swipe={x, y, dx:0, base, cur, lock:null, t0:Date.now()}; swiped=false; };
  // renvoie true si le geste est horizontal (alors la page ne defile pas)
  const move=(x,y)=>{ if(!swipe) return false;
    const fx=x-swipe.x, dy=y-swipe.y;
    if(swipe.lock===null){ if(Math.abs(fx)+Math.abs(dy)<6) return false;   // on attend de connaitre la direction
      swipe.lock = Math.abs(fx) > Math.abs(dy);                              // soit on glisse, soit on monte/descend : jamais les deux
      if(swipe.lock){ swiped=true; t.classList.add("drag"); document.documentElement.style.overflow="hidden"; } }
    if(!swipe.lock) return false;
    const {cur}=swipe; let dx=swipe.base+fx; if((cur===0 && dx>0) || (cur===P.length-1 && dx<0)) dx/=3;   // bout de la bande : on freine
    swipe.dx=dx; t.style.setProperty("--dx", dx+"px"); setO(P, cur - dx/(P[0].offsetWidth+12)); return true; };
  const end=()=>{ if(!swipe) return; const {dx,lock,t0,cur,x}=swipe; document.documentElement.style.overflow="";
    if(!lock){ swipe=null; if(String(cur)!==t.dataset.i0) recentre=setTimeout(()=>{ if(!swipe) render(); }, 700); return; }
    const fx=dx-swipe.base, step=P[0].offsetWidth+12; swipe=null;
    const flick=Math.abs(fx)>12 && Math.abs(fx)/Math.max(1,Date.now()-t0)>.3;   // petit coup rapide = on change aussi
    let k=Math.round(cur - dx/step); if(k===cur && flick) k=cur+(fx<0?1:-1);
    slideTo(k); };
  // doigt : evenements tactiles
  v.addEventListener("touchstart", e=>{ if(e.touches.length===1) start(e.touches[0].clientX, e.touches[0].clientY); else swipe=null; }, {passive:true});
  v.addEventListener("touchmove", e=>{ if(swipe && move(e.touches[0].clientX, e.touches[0].clientY) && e.cancelable) e.preventDefault(); }, {passive:false});
  v.addEventListener("touchend", end); v.addEventListener("touchcancel", end);
  // souris (PC)
  // capture seulement une fois le glisser commencé : capturer dès l'appui envoyait le clic à la bande, pas au cours (plus de fiche sur PC)
  v.addEventListener("pointerdown", e=>{ if(e.pointerType!=="mouse" || e.button) return; start(e.clientX, e.clientY); });
  v.addEventListener("pointermove", e=>{ if(e.pointerType==="mouse" && move(e.clientX, e.clientY) && !v.hasPointerCapture(e.pointerId)) try{ v.setPointerCapture(e.pointerId); }catch{} });
  v.addEventListener("pointerup", e=>{ if(e.pointerType==="mouse") end(); });
  // toucher le jour (ou la semaine) voisin à moitié visible = y aller, comme les flèches ; ses cours ne s'ouvrent pas tant qu'il n'est pas au centre
  v.addEventListener("click", e=>{ if(swiped){ e.stopPropagation(); e.preventDefault(); swiped=false; return; }
    const p=e.target.closest(".dpanel,.wpanel"); if(!p || p.classList.contains("on")) return;
    e.stopPropagation(); e.preventDefault(); slideTo(P.indexOf(p)); }, true);
}

/* ======== fiche d'un cours ======== */
// toutes les infos connues sur un cours, en liste "libelle : valeur"
function facts(e){
  const mins = Math.round((e.e-e.s)/6e4), dur = (mins>=60?Math.floor(mins/60)+"h":"")+(mins%60?String(mins%60).padStart(mins>=60?2:1,"0")+(mins<60?" min":""):"");
  const profs = (e.prof||"").split(" / ").filter(Boolean).map(c=>DATA.profs?.[c] ? `${DATA.profs[c]} (${c})` : c).join(", ");
  const rows = [
    ["Date", fmtD(e.s,{weekday:"long",day:"numeric",month:"long"})],
    ["Horaires", `${fmtH(e.s)} – ${fmtH(e.e)} (${dur})`],
    ["Salle", e.room],
    [(e.prof||"").includes("/")?"Enseignants":"Enseignant", profs],
    ["Type", typeLbl(e.type)!==e.type ? `${typeLbl(e.type)} (${e.type})` : e.type],
    ["Groupe", e.group],
    ["Module", [e.code, e.ue].filter(Boolean).join(" · ")],
    ["Séance", e.num ? "n° "+e.num : ""],
  ];
  return rows.filter(r=>r[1]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
}
function openSheet(key, keep){
  const e=events().find(x=>x.key===key); if(!e) return;
  sheetKey=key; if(!keep) editing=null;
  const l=hwFor(key);
  let h=`<div class="grab"></div>
    <h3 style="${colors(e.code)}">${esc(e.code)} ${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""}
      ${l.length?(()=>{const ok=l.every(x=>done[x.id]);return `<button class="hwbtn ${ok?"ok":"todo"}" onclick="setCourseDone(${!ok})" aria-label="${ok?"Devoir fait, toucher pour annuler":"Marquer le devoir comme fait"}">${ok?ICO_OK:ICO_X}</button>`;})():""}</h3>
    <div style="font-weight:600;margin-top:2px">${esc(e.name)}</div>
    <dl class="facts">${facts(e)}</dl>
    ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:""}`;
  if(!HW_ON){ h+=`<p class="note">Les devoirs ne sont pas encore activés.</p>`; }
  else{
    h+=`<h4>Devoir${l.length>1?"s":""} <small>visible${l.length>1?"s":""} par ${esc(audLabel(audiences().includes(e.group)?e.group:tp))}</small></h4>`;
    l.forEach(x=>{
      if(editing===x.id){
        h+=`<div class="hwbig"><textarea id="edtx" maxlength="1000">${esc(x.texte)}</textarea>
          <div class="act"><button onclick="editing=null;openSheet(sheetKey,true)">Annuler</button>
          <button class="on" onclick="saveEdit(${x.id})">Enregistrer</button></div></div>`;
      }else{
        h+=`<div class="hwbig"><div class="tx">${esc(x.texte)}</div>
          <div class="act"><button onclick="editing=${x.id};openSheet(sheetKey,true)">Modifier</button><button onclick="delHw(${x.id})">Supprimer</button></div></div>`;
      }
    });
    if(editing==="new") h+=`<div class="hwbig"><textarea id="newhw" maxlength="1000" placeholder="Le devoir… (ex : exercices 3 à 5 p. 42)"></textarea>
        <div class="act"><button onclick="editing=null;openSheet(sheetKey,true)">Annuler</button><button class="on" onclick="saveNew()">Enregistrer</button></div></div>`;
    else h+=`<button class="addhw" onclick="editing='new';openSheet(sheetKey,true);$('newhw').focus()">+ ${l.length?"Ajouter un autre devoir":"Ajouter un devoir"}</button>`;
  }
  h+=`<h4>Ma note perso <small>visible par toi seul</small></h4><textarea class="mynote" maxlength="1000" placeholder="Ex : ramener le compas…" oninput="saveNote(this.value)" onblur="render()">${esc(notes[key]||"")}</textarea>`;
  $("sheet").innerHTML=h; $("sheet").classList.add("open"); $("veil").style.display="block";
}

// téléphone : glisser la fiche vers le bas pour la fermer (depuis le haut de la fiche, ou n'importe où quand elle est remontée tout en haut)
(() => { const sh=$("sheet"); let y0=null, dy=0, t0=0;
  sh.addEventListener("touchstart", e=>{ y0 = innerWidth<760 && e.touches.length===1 && sh.scrollTop<=0 && !e.target.closest("textarea,select") ? e.touches[0].clientY : null; dy=0; t0=Date.now(); }, {passive:true});
  sh.addEventListener("touchmove", e=>{ if(y0===null) return; dy = e.touches[0].clientY-y0;
    if(dy<=0){ y0=null; sh.style.transition=""; sh.style.transform=""; return; }   // vers le haut = on fait défiler la fiche normalement
    if(e.cancelable) e.preventDefault(); sh.style.transition="none"; sh.style.transform=`translateY(${dy}px)`; }, {passive:false});
  const fin = () => { if(y0===null) return; y0=null; sh.style.transition="";
    if(dy>100 || (dy>40 && Date.now()-t0<250)){ sh.style.transform="translateY(105%)"; closeSheet(); setTimeout(()=>{ sh.style.transform=""; }, 260); }
    else sh.style.transform=""; dy=0; };
  sh.addEventListener("touchend", fin); sh.addEventListener("touchcancel", fin);
  $("veil").addEventListener("touchmove", e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});
})();

/* ======== compte (facultatif) : pseudo + code PIN, Face ID / empreinte ; suit coches, annonces vues, année, TP, thème, pseudo ======== */
// session ouverte = sessionStorage : survit au rechargement (F5, tirer vers le bas), disparaît quand on ferme l'appli -> le code est redemandé
const CPT_SYNC = ["done","annSeen","theme","view","pseudo","charteCpt","notes"];
let cpt = store.get("cpt", null);                 // {ps, jeton, n (longueur du code), h (empreinte locale, hors ligne), face (id Face ID)}
let cptVue = sessionStorage.getItem("edt.cptVue"); sessionStorage.removeItem("edt.cptVue");
let cptPin = "", cptErr = "", cptTimer = null, cptBusy = false, cptPush = 0;
const cptOuvert = () => !!cpt?.jeton && sessionStorage.getItem("edt.ouvert")===cpt.jeton;
async function rpc(f, body){ const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${f}`, {method:"POST", headers:hdr(), body:JSON.stringify(body)}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function pinHash(ps, pin){ try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(ps.toLowerCase()+":"+pin)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch{ return null; } }
// cet appareil -> compte (1,5 s après le dernier changement)
function cptSave(){ if(!cptOuvert()) return; clearTimeout(cptPush);
  cptPush = setTimeout(()=>{ const etat = {}; CPT_SYNC.forEach(k=>{ const v = store.get(k); if(v!==undefined) etat[k] = v; });
    rpc("compte_ecrire", {p_jeton:cpt.jeton, p_annee:annee, p_tp:tp, p_etat:etat}).catch(()=>{}); }, 1500); }
window.cptHook = k => { if(CPT_SYNC.includes(k) || k==="annee" || k==="tp") cptSave(); };
// compte -> cet appareil. union = 1re connexion sur l'appareil (on garde aussi ses coches) ; sinon le compte fait foi
function cptAppliquer(s, union){
  const e = s.etat || {};
  for(const k of CPT_SYNC) if(e[k]!==undefined){ const loc = store.get(k);
    localStorage.setItem("edt."+k, JSON.stringify(union && (k==="done"||k==="annSeen") && loc && typeof loc==="object" ? {...loc, ...e[k]} : e[k])); }
  if(s.annee) localStorage.setItem("edt.annee", JSON.stringify(s.annee));
  if(s.tp) localStorage.setItem("edt.tp", JSON.stringify(s.tp));
}
function cptOuvrir(s, union){ cpt = {...cpt, ps:s.pseudo, jeton:s.jeton || cpt.jeton}; store.set("cpt", cpt); sessionStorage.setItem("edt.ouvert", cpt.jeton); cptAppliquer(s, union); location.reload(); }
// retour sur l'appli (ou tirer vers le bas) : coches et annonces vues des autres appareils
async function cptTirer(tout){ if(!cptOuvert()) return; try{ const s = await rpc("compte_lire", {p_jeton:cpt.jeton});
  if(!s.ok){ if(s.err==="jeton") cptPerdu(); return; }   // compte supprimé ou déconnecté ailleurs
  if(tout){ if(s.annee && s.annee!==annee){ annee = PROMO = s.annee; localStorage.setItem("edt.annee", JSON.stringify(annee)); DATA = yearData(); }
    if(s.tp && s.tp!==tp){ tp = s.tp; localStorage.setItem("edt.tp", JSON.stringify(tp)); }
    if(s.etat?.charteCpt) localStorage.setItem("edt.charteCpt", "1"); }
  if(s.etat?.done){ done = s.etat.done; localStorage.setItem("edt.done", JSON.stringify(done)); }
  if(s.etat?.annSeen){ annSeen = s.etat.annSeen; localStorage.setItem("edt.annSeen", JSON.stringify(annSeen)); }
  if(!sheetKey && !annOpen) render(); }catch{} }
function cptGo(v){ $("app").dataset.cv = ""; cptVue = v; cptPin = ""; cptErr = ""; clearInterval(cptTimer); render(); scrollTo(0,0); }
function sansCompte(){ store.set("sansCompte", true); cptGo(null); }
// changer de compte / se déconnecter : on vide ce qui appartient au compte sur cet appareil
function cptOubli(vers){ if(cpt?.jeton) rpc("compte_sortir", {p_jeton:cpt.jeton}).catch(()=>{});
  ["cpt","tp","annee","done","annSeen","pseudo","hw","ann","chat","sansCompte","charteCpt"].forEach(k=>localStorage.removeItem("edt."+k));
  sessionStorage.removeItem("edt.ouvert"); if(vers) sessionStorage.setItem("edt.cptVue", vers); location.reload(); }
// ouverture directe : l'appareil est déjà verrouillé par Face ID / empreinte / code du téléphone ; on ne redemande rien
const cptDirect = () => !!cpt?.jeton;   // connecté une fois sur cet appareil = l'appli s'ouvre directement (le code ne sert qu'à se connecter sur un nouvel appareil)
// compte supprimé (remise à zéro du 24/11) : retour à l'accueil (créer / se connecter / sans compte) en gardant année et TP
function cptPerdu(){ ["cpt","charteCpt","sansCompte"].forEach(k=>localStorage.removeItem("edt."+k)); sessionStorage.removeItem("edt.ouvert"); sessionStorage.setItem("edt.cptVue","accueil"); location.reload(); }
if(cpt?.jeton && cptDirect() && !cptOuvert()){ sessionStorage.setItem("edt.ouvert", cpt.jeton); setTimeout(()=>cptTirer(true)); }
else if(cpt?.jeton && !cptOuvert()) rpc("compte_lire", {p_jeton:cpt.jeton}).then(s=>{ if(s.ok===false && s.err==="jeton") cptPerdu(); }).catch(()=>{});   // écran du code : vérifie que le compte existe encore
// après inscription : compte neuf = rattaché à aucun groupe -> l'appli demande l'année puis le TP
function cptFin(){ cptVue = null; cptSave(); render(); }
async function cptInscrire(){
  const ps = $("cps").value.trim(), a = $("cp1").value, b = $("cp2").value;
  if(!/^[A-Za-z0-9À-ÖØ-öø-ÿ_.-]{3,20}$/.test(ps)){ cptErr = "Pseudo : 3 à 20 caractères (lettres, chiffres, . _ -), sans espace."; return cptMaj(); }
  if(!/^\d{4,6}$/.test(a)){ cptErr = "Le code doit faire 4 à 6 chiffres."; return cptMaj(); }
  if(a!==b){ cptErr = "Les deux codes ne sont pas pareils."; return cptMaj(); }
  let s; try{ s = await rpc("compte_creer", {p_pseudo:ps, p_pin:a}); }catch{ cptErr = "Pas de connexion internet."; return cptMaj(); }
  if(!s.ok){ cptErr = {pris:"Ce pseudo est déjà pris, choisis-en un autre.", pseudo:"Ce pseudo n'est pas accepté, choisis-en un autre.", pin:"Le code doit faire 4 à 6 chiffres.", trop:"Trop d'inscriptions en ce moment : réessaie dans une minute."}[s.err] || "Erreur, réessaie."; return cptMaj(); }
  cpt = {ps:s.pseudo, jeton:s.jeton, n:a.length, h:await pinHash(s.pseudo, a)}; store.set("cpt", cpt); sessionStorage.setItem("edt.ouvert", cpt.jeton);
  store.set("sansCompte", false); annee = null; tp = null; ["annee","tp","charteCpt"].forEach(k=>localStorage.removeItem("edt."+k));   // compte neuf : charte à signer, aucun groupe
  toast("Compte créé !"); cptFin();   // puis charte, puis année et TP
}
async function cptConnecter(){
  const ps = $("cps").value.trim(), p = $("cp1").value;
  if(!ps || !/^\d{4,6}$/.test(p)){ cptErr = "Entre ton pseudo et ton code (4 à 6 chiffres)."; return cptMaj(); }
  let s; try{ s = await rpc("compte_connexion", {p_pseudo:ps, p_pin:p}); }catch{ cptErr = "Pas de connexion internet."; return cptMaj(); }
  if(!s.ok) return cptRefus(s, ps);
  cpt = {ps:s.pseudo, jeton:s.jeton, n:p.length, h:await pinHash(s.pseudo, p)};
  store.set("sansCompte", false);
  cptOuvrir(s, true);
}
function cptRefus(s, ps){
  if(s.err==="bloque"){ cptBloque = {ps, fin:Date.now()+s.secondes*1000}; return cptGo("bloque"); }
  cptErr = s.err==="trop" ? "Trop d'essais en ce moment : réessaie dans une minute." : s.reste ? `Code incorrect (${s.reste} essai${s.reste>1?"s":""} restant${s.reste>1?"s":""})` : cpt && cptVue==="verrou" ? "Code incorrect" : "Pseudo ou code incorrect.";
  cptPin = ""; cptMaj(true);
}
let cptBloque = null;
// déverrouillage par code (appareil déjà connecté) : vérifié par le serveur (5 erreurs = bloqué 5 min) ; hors ligne, par l'empreinte locale
async function cptTape(ch){
  if(cptBusy) return;
  if(ch==="<") cptPin = cptPin.slice(0,-1); else if(cptPin.length < (cpt.n||4)) cptPin += ch;
  cptErr = ""; cptMaj();
  if(cptPin.length < (cpt.n||4)) return;
  cptBusy = true; let s = null;
  try{ s = await rpc("compte_connexion", {p_pseudo:cpt.ps, p_pin:cptPin, p_ancien:cpt.jeton}); }catch{}
  cptBusy = false;
  if(s?.ok) return cptOuvrir(s, false);
  if(s) return cptRefus(s, cpt.ps);
  if(cpt.h && await pinHash(cpt.ps, cptPin)===cpt.h){ sessionStorage.setItem("edt.ouvert", cpt.jeton); return cptGo(null); }
  cptErr = "Pas de connexion internet, ou code incorrect."; cptPin = ""; cptMaj(true);
}

  document.body.appendChild(p);
  let y0 = null, x0 = 0, d = 0;
  const peut = t => scrollY<=0 && !cptVue && !$("sheet").classList.contains("open") && !t.closest("input,textarea,select,button,a,.sheet,.links");
  const start = (x,y,t) => { y0 = peut(t) ? y : null; x0 = x; d = 0; };
  const move = (x,y) => { if(y0===null) return; d = y-y0;
    if(Math.abs(x-x0) > Math.max(12, d)){ y0 = null; p.style.opacity = 0; return; }   // geste horizontal = changer de jour, pas actualiser
    const q = Math.max(0, Math.min(d/2, 80)); p.style.transform = `translate(-50%,${q-46}px) rotate(${q*4}deg)`; p.style.opacity = Math.min(1, q/50); p.classList.toggle("go", q>=60); };
  const end = () => { if(y0===null) return; y0 = null; if(d/2>=60) actualiser(); else { p.style.transform = ""; p.style.opacity = 0; } };
  addEventListener("touchstart", e=>{ if(e.touches.length===1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); else y0 = null; }, {passive:true});
  addEventListener("touchmove", e=>move(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  addEventListener("touchend", end); addEventListener("touchcancel", end);
  addEventListener("pointerdown", e=>{ if(e.pointerType==="mouse" && !e.button) start(e.clientX, e.clientY, e.target); });
  addEventListener("pointermove", e=>{ if(e.pointerType==="mouse" && y0!==null){ move(e.clientX, e.clientY); if(d>8) e.preventDefault(); } });
  addEventListener("pointerup", e=>{ if(e.pointerType==="mouse") end(); });
})();

/* ======== demarrage ======== */
addEventListener("keydown",e=>{ if(["TEXTAREA","INPUT","SELECT"].includes(e.target.tagName)) return; if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ loadData(); loadHw(); loadAnn(); loadFb(); loadChat(); loadSupport(); } });
setInterval(()=>{ if(!sheetKey && !annOpen) render(); }, 60000);
// appli rouverte un autre jour (iPhone : elle ne se recharge pas toute seule) : on revient sur aujourd'hui
let openDay = ymd(startDay());   // change aussi à 18h
document.addEventListener("visibilitychange", ()=>{ if(document.hidden || ymd(startDay())===openDay) return; openDay = ymd(startDay()); if(!sheetKey && !annOpen) goToday(); });
setInterval(()=>{ if(!document.hidden){ loadHw(); loadAnn(); loadFb(); loadChat(); loadSupport(); } }, 90000);
/* ======== avis « modifications en cours » et fermeture du site : interrupteurs de la page perso (table etat), jamais automatiques ======== */
// avis : ne bloque rien, montré une fois quand il s'allume et une fois quand il s'éteint ; fermé : écran « Application fermée », plus rien ne marche (le serveur refuse aussi)
let maint = false, ferme = store.get("ferme", false);
function canWrite(){ if(!ferme) return true; toast("L'application est fermée pour le moment"); return false; }
function showMaint(on){ $("mainth").textContent = on ? "Modifications en cours" : "Modifications terminées";
  $("maintp").textContent = on ? "Le créateur est en train d'améliorer l'appli. Si quelque chose bug ou s'affiche bizarrement, pas d'inquiétude : c'est temporaire. Tu peux continuer à tout utiliser normalement." : "L'appli est à jour. Merci de ta patience !";
  $("maint").classList.add("on"); }
async function loadEtat(){
  try{ const r = await fetch(`${SUPA_URL}/rest/v1/etat?select=maintenance,depuis,ferme&id=eq.1`, {headers:hdr()}); if(!r.ok) return;
    const [e] = await r.json(); if(!e) return;
    if(!!e.ferme !== ferme){ ferme = !!e.ferme; store.set("ferme", ferme); $("app").dataset.cv = ""; render(); }
    maint = !!e.maintenance;
    if(maint && store.get("maintVu")!==e.depuis){ store.set("maintVu", e.depuis); showMaint(true); }
    else if(!maint && store.get("maintVu") && store.get("maintFin")!==store.get("maintVu")){ store.set("maintFin", store.get("maintVu")); showMaint(false); }
  }catch{}
}
setInterval(()=>{ if(!document.hidden) loadEtat(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) loadEtat(); });
/* ======== rappel : appli ouverte dans Safari / Chrome (barres du navigateur visibles) au lieu de l'icône de l'écran d'accueil ======== */
// une fois par jour au plus, seulement sur téléphone ; installée en plein écran = jamais
(function(){
  const installee = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if(installee || !matchMedia("(pointer:coarse)").matches || innerWidth >= 760 || window.top !== window) return;
  const jour = ymd(new Date()); if(store.get("instVu") === jour) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $("instp").innerHTML = `Tu utilises l'emploi du temps dans ${ios ? "Safari" : "ton navigateur"}, avec la barre d'adresse et les onglets. Pour l'avoir en vraie appli, en plein écran :</p><ol>${ios
    ? "<li>touche <b>Partager</b> (le carré avec la flèche) ;</li><li>choisis <b>Sur l'écran d'accueil</b> et laisse <b>Ouvrir en tant qu'app web</b> activé ;</li><li>ouvre ensuite l'appli avec l'icône <b>EDT</b>, plus depuis Safari.</li>"
    : "<li>touche le menu (les trois points) ;</li><li>choisis <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b> ;</li><li>ouvre ensuite l'appli avec l'icône <b>EDT</b>.</li>"}</ol><p>Tu as déjà l'icône mais tu vois encore les barres ? Supprime-la et refais ces étapes.`;
  setTimeout(()=>{ if(!$("maint").classList.contains("on")){ store.set("instVu", jour); $("inst").classList.add("on"); } }, 1800);
})();
render(); loadData(); loadHw(); loadAnn(); loadFb(); loadChat(); loadSupport(); loadEtat();
{ let n = 0; const t = setInterval(()=>{ if(++n > 24 || notifDemande()) clearInterval(t); }, 5000); setTimeout(notifDemande, 3000); }
</script>
