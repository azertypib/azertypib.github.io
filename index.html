<style>
  :root{
    --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1b18; --muted:#77716a; --line:#e6e1da;
    --accent:#e0533d; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
    --hour:64px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141312; --panel:#1d1c1a; --ink:#f1ede7; --muted:#9a948c; --line:#2d2b28; --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;}
  .wrap{max-width:1240px;margin:0 auto;padding:28px 24px 48px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
  h1 small{font-size:16px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
  .nav{display:flex;gap:6px;align-items:center}
  .nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);height:36px;min-width:36px;
              padding:0 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  .nav button:hover{border-color:var(--muted)}
  .nav button.today{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .next{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:14px;padding:14px 18px;
        box-shadow:var(--shadow);margin-bottom:18px;border-left:5px solid var(--c,var(--accent))}
  .next .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
  .next .what{font-size:17px;font-weight:650}
  .next .when{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
  .next .when span{display:block;font-size:13px;color:var(--muted);font-weight:500}

  /* ----- grille semaine ----- */
  .grid{display:grid;grid-template-columns:52px repeat(var(--days),1fr);background:var(--panel);
        border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .dayhead{padding:12px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
  .dayhead b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .dayhead span{font-size:22px;font-weight:700}
  .dayhead.is-today span{background:var(--accent);color:#fff;border-radius:8px;padding:0 7px}
  .corner{border-bottom:1px solid var(--line)}
  .times{position:relative}
  .times div{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
  .col{position:relative;border-left:1px solid var(--line);
       background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
  .col.is-today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
  .ev{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;overflow:hidden;
      background:var(--bgc);color:var(--fg);border-left:4px solid var(--c);font-size:12.5px;line-height:1.3}
  .ev .t{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .badge{font-size:10px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:var(--c);color:#fff}
  .ev .n{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .m{margin-top:2px;font-weight:600}
  .ev .h{opacity:.7;font-variant-numeric:tabular-nums}
  .ev.exam{box-shadow:inset 0 0 0 2px var(--c)}
  .ev.past{opacity:.45}
  .now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3}
  .now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

  /* ----- liste (téléphone) ----- */
  .list{display:none}
  .day{margin-bottom:18px}
  .day h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
  .day.is-today h2{color:var(--accent)}
  .item{display:flex;gap:12px;background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:8px;
        box-shadow:var(--shadow);border-left:5px solid var(--c)}
  .item .hrs{font-variant-numeric:tabular-nums;font-weight:650;min-width:54px}
  .item .hrs span{display:block;color:var(--muted);font-weight:500}
  .item .t{font-weight:700}
  .item .n{color:var(--muted);font-size:13.5px}
  .item .m{font-size:13.5px;margin-top:2px}
  .empty{color:var(--muted);font-style:italic;padding:6px 2px}

  footer{margin-top:18px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .legend{display:flex;gap:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}

  @media (max-width:760px){
    .wrap{padding:calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
    h1{font-size:24px}
    .grid{display:none}
    .list{display:block}
    .next{flex-wrap:wrap}
    .next .when{margin-left:0;text-align:left}
  }
</style>
</head>

<div class="wrap">

    <div>
      <div class="eyebrow" id="sub">IUT La Rochelle</div>

    </div>

      <button id="prev" title="Semaine précédente (←)">‹</button>
      <button id="today" class="today">Aujourd'hui</button>
      <button id="next" title="Semaine suivante (→)">›</button>
    </div>
  </header>
  <div id="nextcard"></div>
  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>
  <footer>
    <div class="legend" id="legend"></div>
    <div id="upd"></div>
  </footer>
</div>

Mathématiques 1"}]};

const TYPES = {TP:"TP",TD:"TD",CM:"CM",DS:"Examen",PRTUT:"Projet",PRTUT1:"Projet",PRTUT2:"Projet"};
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const fmtH = d => d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":", "h");
const fmtD = (d,o) => d.toLocaleDateString("fr-FR",o);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const events = (DATA?.events||[]).map(e=>({...e,s:new Date(e.start),e:new Date(e.end)}));

// une couleur stable par matière
const PALETTE = [8,200,145,280,35,330,175,240,95,15,260,55];
const hueOf = {};
[...new Set(events.map(e=>e.code))].sort().forEach((c,i)=>hueOf[c]=PALETTE[i%PALETTE.length]);
const dark = matchMedia("(prefers-color-scheme:dark)").matches;
function colors(code){
  const h = hueOf[code] ?? 0;
  return dark ? `--c:hsl(${h} 65% 58%);--bgc:hsl(${h} 30% 20%);--fg:hsl(${h} 40% 92%)`
              : `--c:hsl(${h} 62% 50%);--bgc:hsl(${h} 75% 95%);--fg:hsl(${h} 45% 22%)`;
}
const isExam = e => e.type==="DS";
const typeLbl = t => TYPES[t] || t || "";

function monday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
const sameDay = (a,b) => a.toDateString()===b.toDateString();

let now = new Date();
let week = monday(now);
if (now.getDay()===0 || now.getDay()===6) week.setDate(week.getDate()+7); // le week-end on montre la semaine suivante

function render(){
  now = new Date();
  const end = new Date(week); end.setDate(end.getDate()+7);
  const wk = events.filter(e=>e.s>=week && e.s<end);
  const hasSat = wk.some(e=>e.s.getDay()===6);
  const nDays = hasSat?6:5;
  const last = new Date(week); last.setDate(last.getDate()+nDays-1);

  document.getElementById("title").innerHTML =
    `Semaine ${isoWeek(week)} <small>${fmtD(week,{day:"numeric",month:"short"})} – ${fmtD(last,{day:"numeric",month:"short",year:"numeric"})}</small>`;
  document.getElementById("sub").textContent =
    "IUT La Rochelle" + (DATA?.groups?.length ? " · " + DATA.groups.join(" · ") : "");

  // plage horaire
  let h0=8,h1=18;
  wk.forEach(e=>{ h0=Math.min(h0,e.s.getHours()); h1=Math.max(h1,Math.ceil(e.e.getHours()+e.e.getMinutes()/60)); });
  const H = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  const top = d => ((d.getHours()+d.getMinutes()/60)-h0)*H;

  // ----- grille -----
  const g = document.getElementById("grid");
  g.style.setProperty("--days",nDays);
  let html = `<div class="corner"></div>`;
  for(let i=0;i<nDays;i++){
    const d=new Date(week); d.setDate(d.getDate()+i);
    html += `<div class="dayhead ${sameDay(d,now)?"is-today":""}"><b>${DAYS[i]}</b><span>${d.getDate()}</span></div>`;
  }
  html += `<div class="times" style="height:${(h1-h0)*H}px">`;
  for(let h=h0+1;h<h1;h++) html += `<div style="top:${(h-h0)*H}px">${h}h</div>`;
  html += `</div>`;
  for(let i=0;i<nDays;i++){
    const d=new Date(week); d.setDate(d.getDate()+i);
    html += `<div class="col ${sameDay(d,now)?"is-today":""}" style="height:${(h1-h0)*H}px">`;
    wk.filter(e=>sameDay(e.s,d)).forEach(e=>{
      const y=top(e.s), hgt=top(e.e)-y-3;
      html += `<div class="ev ${isExam(e)?"exam":""} ${e.e<now?"past":""}" style="top:${y+1}px;height:${hgt}px;${colors(e.code)}"
                 title="${esc(e.name)}&#10;${fmtH(e.s)} – ${fmtH(e.e)}&#10;${esc(e.room)} · ${esc(e.prof)} · ${esc(e.group)}">
        <div class="t">${esc(e.code)} ${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""}</div>
        ${hgt>58?`<div class="n">${esc(e.name)}</div>`:""}
        <div class="m">${esc(e.room)}${e.prof?` <span class="h">· ${esc(e.prof)}</span>`:""}</div>
        ${hgt>78?`<div class="h">${fmtH(e.s)} – ${fmtH(e.e)}</div>`:""}
      </div>`;
    });
    if(sameDay(d,now) && now.getHours()>=h0 && now.getHours()<h1) html += `<div class="now" style="top:${top(now)}px"></div>`;
    html += `</div>`;
  }
  g.innerHTML = html;

  // ----- liste -----
  let lh="";
  for(let i=0;i<nDays;i++){
    const d=new Date(week); d.setDate(d.getDate()+i);
    const de = wk.filter(e=>sameDay(e.s,d));
    lh += `<div class="day ${sameDay(d,now)?"is-today":""}"><h2>${DAYS[i]} ${d.getDate()} ${fmtD(d,{month:"long"})}${sameDay(d,now)?" · aujourd'hui":""}</h2>`;
    lh += de.length ? de.map(e=>`<div class="item" style="${colors(e.code)}">
        <div class="hrs">${fmtH(e.s)}<span>${fmtH(e.e)}</span></div>
        <div><div class="t">${esc(e.code)} ${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""}</div>
        <div class="n">${esc(e.name)}</div><div class="m">${esc(e.room)}${e.prof?` · ${esc(e.prof)}`:""}</div></div></div>`).join("")
      : `<div class="empty">Pas de cours</div>`;
    lh += `</div>`;
  }
  document.getElementById("list").innerHTML = lh;

  // ----- prochain cours -----
  const cur = events.find(e=>e.s<=now && e.e>now);
  const nxt = events.find(e=>e.s>now);
  const show = cur || nxt;
  let nc="";
  if(show){
    const mins = Math.round((show.s-now)/6e4);
    let when;
    if(cur) when = `En cours<span>jusqu'à ${fmtH(cur.e)}</span>`;
    else if(sameDay(show.s,now)) when = (mins<60?`Dans ${mins} min`:`Dans ${Math.floor(mins/60)}h${String(mins%60).padStart(2,"0")}`)+`<span>à ${fmtH(show.s)}</span>`;
    else when = `${fmtD(show.s,{weekday:"long",day:"numeric",month:"short"})}<span>à ${fmtH(show.s)}</span>`;
    nc = `<div class="next" style="${colors(show.code)}">
      <div><div class="lbl">${cur?"Cours actuel":"Prochain cours"}</div>
      <div class="what">${esc(show.code)} ${show.type?`<span class="badge">${esc(typeLbl(show.type))}</span>`:""} · ${esc(show.name)}</div>
      <div style="color:var(--muted)">Salle ${esc(show.room)}${show.prof?` · ${esc(show.prof)}`:""}</div></div>
      <div class="when">${when}</div></div>`;
  }
  document.getElementById("nextcard").innerHTML = nc;

  // ----- légende + mise à jour -----
  const codes = [...new Map(wk.map(e=>[e.code,e])).values()];
  document.getElementById("legend").innerHTML = codes.map(e=>`<span style="${colors(e.code)}"><i></i>${esc(e.code)} – ${esc(e.name)}</span>`).join("");
  document.getElementById("upd").textContent = DATA?.updated
    ? "Mis à jour le " + fmtD(new Date(DATA.updated),{weekday:"long",day:"numeric",month:"long"}) + " à " + fmtH(new Date(DATA.updated))
    : "Pas encore de données — lance edt.ps1";
}

const shift = n => { week.setDate(week.getDate()+7*n); render(); };
document.getElementById("prev").onclick = ()=>shift(-1);
document.getElementById("next").onclick = ()=>shift(1);
document.getElementById("today").onclick = ()=>{ week=monday(new Date()); const d=new Date().getDay(); if(d===0||d===6) week.setDate(week.getDate()+7); render(); };
addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") shift(-1); if(e.key==="ArrowRight") shift(1); });
setInterval(render, 60000);
render();
</script>
</body>
</html>
