<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EDT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141312">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d1b18; --muted:#77716a; --line:#e6e1da; --soft:#efebe5;
  --accent:#e0533d; --ok:#2f9e5b; --todo:#e08a1e; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
  --hour:56px; --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
}
:root[data-theme=dark]{
  --bg:#141312; --panel:#1d1c1a; --ink:#f1ede7; --muted:#9a948c; --line:#2d2b28; --soft:#262422; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:calc(14px + var(--top)) 12px calc(40px + var(--bot))}

/* ---------- en-tete ---------- */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ttl{flex:1;min-width:160px}
.ttl h1{margin:0;font-size:24px;letter-spacing:-.02em}
.ttl div{color:var(--muted);font-size:13px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:650;font-size:14px}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);height:36px;min-width:36px;padding:0 12px;border-radius:10px;font-weight:600}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--panel);height:34px;padding:0 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

.sq{position:relative;width:48px;height:48px;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;
  font-size:19px;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sq small{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.sq .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
header .ttl{min-width:0}

/* ---------- grille semaine ---------- */
.grid{display:grid;grid-template-columns:30px repeat(var(--days),1fr);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dh{padding:8px 4px;text-align:center;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.dh b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dh span{font-size:17px;font-weight:700}
.dh.today span{background:var(--accent);color:#fff;border-radius:7px;padding:0 6px}
.corner{border-bottom:1px solid var(--line)}
.times{position:relative}
.times div{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hour)}
.ev{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;overflow:hidden;cursor:pointer;
  background:var(--bgc);color:var(--fg);border-left:3px solid var(--c);font-size:11px;line-height:1.25}
.ev .t{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .r{font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .x{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.exam{box-shadow:inset 0 0 0 2px var(--c)}
.ev.past{opacity:.5}
.now{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* pastille devoir */
.hw{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;border-radius:5px;padding:1px 4px;color:#fff;white-space:nowrap}
.hw.todo{background:var(--todo)} .hw.ok{background:var(--ok)}
.ev .hw{position:absolute;right:3px;bottom:3px}
.badge{font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--c);color:#fff;vertical-align:1px}

/* ---------- vue jour ---------- */
.days{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.days button{flex:1;min-width:54px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 0;text-align:center}
.days button b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.days button span{font-size:18px;font-weight:700}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .days button.on b{color:var(--bg)}
.days button.today span{color:var(--accent)} .days button.on.today span{color:var(--bg)}
.card{display:flex;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:5px solid var(--c);cursor:pointer}
.card .hrs{font-variant-numeric:tabular-nums;font-weight:700;min-width:50px}
.card .hrs span{display:block;color:var(--muted);font-weight:500}
.card .t{font-weight:800}
.card .n{color:var(--muted);font-size:13.5px}
.card .m{font-size:13.5px;margin-top:2px}
.card .memo{font-size:13px;margin-top:4px;color:var(--muted);font-style:italic}
.card .hwl{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.card .hwl div{font-size:13.5px;display:flex;gap:6px;align-items:flex-start}
.card .hwl .done{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:14px 4px}
.gap{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px 14px;margin:0 0 8px;color:var(--muted);font-weight:700;font-size:14px}
.gap span{font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- annonces ---------- */
.ann{margin-bottom:12px}
.ann .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ann .head b{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ann .head button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:650;font-size:13px}
.annbox{display:flex;gap:12px;background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);border-left:5px solid var(--accent);cursor:pointer}
.annbox .d{font-weight:800;min-width:62px;font-size:13px;line-height:1.25}
.annbox .d span{display:block;color:var(--muted);font-weight:600}
.annbox .tx{flex:1;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.annbox.today{border-left-color:var(--todo)}
input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);margin-bottom:8px}

/* ---------- devoirs (bas de page) ---------- */
.sect{margin-top:22px}
.sect h2{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:650}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hwitem{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.hwitem .tx{flex:1;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.hwitem .meta{font-size:12px;color:var(--muted);margin-top:2px}
.ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;margin:0;cursor:pointer;display:grid;place-content:center;background:var(--panel)}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px}

/* ---------- fiche cours (bottom sheet) ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;
  padding:10px 16px calc(20px + var(--bot));transform:translateY(105%);transition:transform .22s ease;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.sheet:not(.open){box-shadow:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .info{color:var(--muted);margin:4px 0 0;font-size:14px}
.sheet .memo{margin-top:8px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px}
.sheet h4{margin:16px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h4 small{font-weight:500;color:var(--muted);font-size:12px}
.hwrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.hwrow .tx{flex:1;white-space:pre-wrap;word-break:break-word}
.hwrow .tx.done{text-decoration:line-through;color:var(--muted)}
.hwrow .meta{font-size:12px;color:var(--muted)}
.hwrow .act{display:flex;gap:4px}
.hwrow .act button{border:0;background:var(--soft);border-radius:8px;padding:4px 8px;font-size:12.5px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{flex:1}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---------- choix du groupe ---------- */
.pick{max-width:420px;margin:12vh auto 0;text-align:center}
.pick h1{font-size:28px;margin:12px 0 4px}
.pick p{color:var(--muted);margin:0 0 20px}
.pick .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.pick .opts button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px 10px;font-size:20px;font-weight:800;box-shadow:var(--shadow)}
.pick .back{margin-top:18px;border:0;background:none;color:var(--muted);text-decoration:underline}

footer{margin-top:22px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--bot));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;display:none}

@media (min-width:800px){
  :root{--hour:64px}
  .grid{grid-template-columns:48px repeat(var(--days),1fr)}
  .ev{font-size:12.5px;padding:6px 8px;left:4px;right:4px}
  .ev .t{font-size:13.5px}
  .times div{font-size:11px;right:8px}
  .sheet{bottom:auto;top:50%;border-radius:18px;transform:translate(0,-40%) scale(.98);opacity:0;pointer-events:none;transition:.18s}
  .sheet.open{transform:translate(0,-50%);opacity:1;pointer-events:auto}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ======== Configuration de la base des devoirs (Supabase) ======== */
const SUPA_URL = "https://oysfbsdpdcjpufrfpmjx.supabase.co";
const SUPA_KEY = "sb_publishable_qHE46e33ZJ-_AFLZkXG4YA_ty7QAaXx";   // cle publique, faite pour etre dans la page

/* ======== utilitaires ======== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtH = d => d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":","h");
const fmtD = (d,o) => d.toLocaleDateString("fr-FR",o);
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const TYPES = {DS:"Examen",PRTUT:"Projet",PRTUT1:"Projet",PRTUT2:"Projet"};
const typeLbl = t => TYPES[t] || t || "";
const sameDay = (a,b) => a.toDateString() === b.toDateString();
function monday(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2200); }
const store = {
  get(k,d){ try{ const v=localStorage.getItem("edt."+k); return v==null?d:JSON.parse(v);}catch{ return d; } },
  set(k,v){ localStorage.setItem("edt."+k, JSON.stringify(v)); }
};

/* ======== etat ======== */
let DATA = store.get("data", null);
let tp = store.get("tp", null);
let view = store.get("view", innerWidth < 800 ? "jour" : "semaine");
let hwTab = "todo";
let homework = store.get("hw", []);           // devoirs partages du TP (cache local)
let done = store.get("done", {});              // coches personnelles : { idDevoir: true }
let now = new Date();
let week = monday(now); if (now.getDay()===0 || now.getDay()===6) week.setDate(week.getDate()+7);
let dayIdx = Math.min(4, Math.max(0, (now.getDay()+6)%7)); if (now.getDay()===0||now.getDay()===6) dayIdx = 0;
let pickStep = null, pickTd = null;
let sheetKey = null, editing = null;

/* ======== theme clair / sombre (par defaut : celui du telephone) ======== */
const svg = p => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON_ANN  = svg('<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>');
const ICON_SUN  = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const ICON_MOON = svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
let theme = store.get("theme", matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
function applyTheme(){ document.documentElement.dataset.theme = theme; document.querySelector('meta[name="theme-color"]').content = theme==="dark" ? "#141312" : "#f4f2ee"; }
function toggleTheme(){ theme = theme==="dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(); render(); }
applyTheme();

/* ======== couleurs par matiere ======== */
const PALETTE=[8,200,145,280,35,330,175,240,95,15,260,55,120,300];
const hue={};
function colors(code){
  if(!(code in hue)){ let h=0; for(const ch of code) h=(h*31+ch.charCodeAt(0))>>>0; hue[code]=PALETTE[h%PALETTE.length]; }
  const h=hue[code], dark=theme==="dark";
  return dark ? `--c:hsl(${h} 65% 58%);--bgc:hsl(${h} 30% 20%);--fg:hsl(${h} 40% 92%)`
              : `--c:hsl(${h} 62% 48%);--bgc:hsl(${h} 75% 94%);--fg:hsl(${h} 45% 22%)`;
}

/* ======== donnees ======== */
function events(){
  if(!DATA || !tp || !DATA.events[tp]) return [];
  return DATA.events[tp].map(e=>({...e, s:new Date(e.start), e:new Date(e.end), key:e.code+"|"+e.start, name:DATA.names?.[e.code]||""}));
}
// Pages garde la page 10 min en cache : on compare avec la version en ligne et on recharge si elle a change.
const APP_V = "2026-11-22g";
async function checkUpdate(){
  try{
    const t = await (await fetch(location.pathname+"?check="+Date.now(), {cache:"no-store"})).text();
    const v = (t.match(/const APP_V = "([^"]+)"/)||[])[1];
    if(v && v!==APP_V) location.replace(location.pathname+"?v="+v);
  }catch{}
}
async function loadData(){
  checkUpdate();
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    DATA = await r.json(); store.set("data", DATA);
  }catch{ if(!DATA) toast("Pas de connexion"); }
  render();
}

/* ======== devoirs (Supabase REST) ======== */
const HW_ON = !!(SUPA_URL && SUPA_KEY);
function hdr(extra){ const h={apikey:SUPA_KEY,"Content-Type":"application/json",...extra}; if(!SUPA_KEY.startsWith("sb_")) h.Authorization="Bearer "+SUPA_KEY; return h; }
async function loadHw(){
  if(!HW_ON || !tp) return;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/devoirs?tp=eq.${encodeURIComponent(tp)}&deleted=is.false&order=due.asc,created_at.asc`, {headers:hdr()});
    if(!r.ok) throw 0;
    homework = await r.json(); store.set("hw", homework); render(); if(sheetKey) openSheet(sheetKey,true);
  }catch{}
}
async function addHw(ev, texte){
  const body={tp, ckey:ev.key, code:ev.code, due:ev.start, texte};
  const r = await fetch(`${SUPA_URL}/rest/v1/devoirs`, {method:"POST", headers:hdr({Prefer:"return=representation"}), body:JSON.stringify(body)});
  if(!r.ok){ toast("Erreur : devoir non enregistré"); return; }
  toast("Devoir ajouté pour tout le "+tpLabel(tp)); await loadHw();
}
async function patchHw(id, fields, msg){
  const r = await fetch(`${SUPA_URL}/rest/v1/devoirs?id=eq.${id}`, {method:"PATCH", headers:hdr(), body:JSON.stringify({...fields, updated_at:new Date().toISOString()})});
  if(!r.ok){ toast("Erreur : modification non enregistrée"); return; }
  if(msg) toast(msg); await loadHw();
}
const hwFor = key => homework.filter(h=>h.ckey===key);
function hwBadge(key, big){
  const l = hwFor(key); if(!l.length) return "";
  const ok = l.every(h=>done[h.id]);
  return `<span class="hw ${ok?"ok":"todo"}">${ok?"✓":"✗"}${big||l.length>1?" Devoir"+(l.length>1?"s":""):""}</span>`;
}
function toggleDone(id, v){ if(v) done[id]=true; else delete done[id]; store.set("done", done); render(); if(sheetKey) openSheet(sheetKey,true); }

/* ======== groupes ======== */
const tdLabel = g => "Groupe " + g.replace(/^S\d/,"");
const tpLabel = g => g.replace(/^S\d/,"");
function tdOf(t){ for(const [td,l] of Object.entries(DATA?.groups||{})) if(l.includes(t)) return td; return ""; }

/* ======== rendu ======== */
function render(){
  now = new Date();
  const app = $("app");
  if(!DATA){ app.innerHTML = `<div class="pick"><img src="icon.png" width="72" style="border-radius:16px"><h1>Chargement…</h1></div>`; return; }
  if(!tp || !DATA.events[tp] || pickStep){ renderPick(); return; }

  const all = events();
  const end = new Date(week); end.setDate(end.getDate()+7);
  const wk = all.filter(e=>e.s>=week && e.s<end);
  const nDays = wk.some(e=>e.s.getDay()===6) ? 6 : 5;
  const last = new Date(week); last.setDate(last.getDate()+nDays-1);

  let h = `<header>
      <div class="ttl"><h1>Semaine ${isoWeek(week)}</h1><div>${fmtD(week,{day:"numeric",month:"short"})} – ${fmtD(last,{day:"numeric",month:"short"})}</div></div>
      <button class="sq" onclick="toggleTheme()" aria-label="Mode clair ou sombre">${theme==="dark"?ICON_SUN:ICON_MOON}</button>
      ${HW_ON?`<button class="sq" onclick="openAnnList()" aria-label="Annonces">${ICON_ANN}${annVisible().length?`<span class="cnt">${annVisible().length}</span>`:""}</button>`:""}
      <button class="sq" onclick="startPick()" aria-label="Changer de groupe">${esc(tdLabel(tdOf(tp)).replace("Groupe ",""))}<small>${esc(tpLabel(tp))}</small></button>
    </header>
    <div class="bar">
      <button class="btn" onclick="shift(-1)" aria-label="Semaine précédente">‹</button>
      <button class="btn dark" onclick="goToday()">Aujourd'hui</button>
      <button class="btn" onclick="shift(1)" aria-label="Semaine suivante">›</button>
      <div class="seg"><button class="${view==="jour"?"on":""}" onclick="setView('jour')">Jour</button><button class="${view==="semaine"?"on":""}" onclick="setView('semaine')">Semaine</button></div>
    </div>`;

  h += view==="semaine" ? renderWeek(wk, nDays) : renderDay(wk, nDays);
  h += renderHwSection(all);
  h += `<footer><span>${DATA.updated?"Emploi du temps vérifié le "+fmtD(new Date(DATA.updated),{day:"numeric",month:"short"})+" à "+fmtH(new Date(DATA.updated)):""}</span>
        <span><a href="#" onclick="shareLink();return false" style="color:inherit">Partager l'appli</a></span></footer>`;
  app.innerHTML = h;
}

function renderWeek(wk, nDays){
  let h0=8,h1=18;
  wk.forEach(e=>{ h0=Math.min(h0,e.s.getHours()); h1=Math.max(h1,Math.ceil(e.e.getHours()+e.e.getMinutes()/60)); });
  const H=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hour"));
  const top=d=>((d.getHours()+d.getMinutes()/60)-h0)*H;
  let h=`<div class="grid" style="--days:${nDays}"><div class="corner"></div>`;
  for(let i=0;i<nDays;i++){ const d=new Date(week); d.setDate(d.getDate()+i);
    h+=`<div class="dh ${sameDay(d,now)?"today":""}"><b>${DAYS[i].slice(0,3)}</b><span>${d.getDate()}</span></div>`; }
  h+=`<div class="times" style="height:${(h1-h0)*H}px">`;
  for(let x=h0+1;x<h1;x++) h+=`<div style="top:${(x-h0)*H}px">${x}h</div>`;
  h+=`</div>`;
  for(let i=0;i<nDays;i++){
    const d=new Date(week); d.setDate(d.getDate()+i);
    h+=`<div class="col" style="height:${(h1-h0)*H}px">`;
    wk.filter(e=>sameDay(e.s,d)).forEach(e=>{
      const y=top(e.s), hg=top(e.e)-y-2;
      h+=`<div class="ev ${e.type==="DS"?"exam":""} ${e.e<now?"past":""}" style="top:${y+1}px;height:${hg}px;${colors(e.code)}" onclick="openSheet('${esc(e.key)}')">
        <div class="t">${esc(e.code)}</div><div class="r">${esc(e.room)}</div>
        ${hg>70?`<div class="x">${esc(typeLbl(e.type))}${e.prof?" · "+esc(e.prof):""}</div>`:""}
        ${hg>95?`<div class="x">${fmtH(e.s)}–${fmtH(e.e)}</div>`:""}
        ${hwBadge(e.key)}</div>`;
    });
    if(sameDay(d,now)&&now.getHours()>=h0&&now.getHours()<h1) h+=`<div class="now" style="top:${top(now)}px"></div>`;
    h+=`</div>`;
  }
  return h+`</div>` + (wk.length?"":`<div class="empty">Pas de cours cette semaine (ou semaine pas encore publiée par l'IUT).</div>`);
}

function renderDay(wk, nDays){
  if(dayIdx>=nDays) dayIdx=nDays-1;
  let h=`<div class="days">`;
  for(let i=0;i<nDays;i++){ const d=new Date(week); d.setDate(d.getDate()+i);
    const n=wk.filter(e=>sameDay(e.s,d)).length;
    h+=`<button class="${i===dayIdx?"on":""} ${sameDay(d,now)?"today":""}" onclick="setDay(${i})"><b>${DAYS[i].slice(0,3)}</b><span>${d.getDate()}</span>${n?"":`<b>—</b>`}</button>`; }
  h+=`</div>`;
  const d=new Date(week); d.setDate(d.getDate()+dayIdx);
  const de=wk.filter(e=>sameDay(e.s,d));
  if(!de.length) return h+`<div class="empty">Pas de cours le ${DAYS[dayIdx].toLowerCase()} ${d.getDate()} ${fmtD(d,{month:"long"})}.</div>`;
  return h + de.map((e,i)=>{
    const l=hwFor(e.key);
    // trou d'au moins 30 min depuis la fin du cours precedent (les 15 min d'intercours ne comptent pas)
    const prevEnd = i ? Math.max(...de.slice(0,i).map(x=>+x.e)) : 0;
    const gap = prevEnd ? Math.round((e.s-prevEnd)/6e4) : 0;
    const pause = gap>=30 ? `<div class="gap">Pause de ${gap>=60?Math.floor(gap/60)+"h"+(gap%60?String(gap%60).padStart(2,"0"):""):gap+" min"}<span>${fmtH(new Date(prevEnd))} – ${fmtH(e.s)}</span></div>` : "";
    return pause + `<div class="card" style="${colors(e.code)}" onclick="openSheet('${esc(e.key)}')">
      <div class="hrs">${fmtH(e.s)}<span>${fmtH(e.e)}</span></div>
      <div style="flex:1;min-width:0"><div class="t">${esc(e.code)} ${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""} ${hwBadge(e.key,true)}</div>
        <div class="n">${esc(e.name)}</div>
        <div class="m">Salle ${esc(e.room)}${e.prof?` · ${esc(e.prof)}`:""}</div>
        ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:""}
        ${l.length?`<div class="hwl">${l.map(x=>`<div><input type="checkbox" class="ck" ${done[x.id]?"checked":""} onclick="event.stopPropagation();toggleDone(${x.id},this.checked)"><span class="${done[x.id]?"done":""}">${esc(x.texte)}</span></div>`).join("")}</div>`:""}
      </div></div>`;
  }).join("");
}

function renderHwSection(all){
  if(!HW_ON) return "";
  const byKey={}; all.forEach(e=>byKey[e.key]=e);
  const todo=homework.filter(h=>!done[h.id]), fin=homework.filter(h=>done[h.id]);
  const list = hwTab==="todo" ? todo : fin.slice().reverse();
  let h=`<div class="sect"><h2>Devoirs <span class="chip" style="font-size:12px">${esc(tpLabel(tp))}</span></h2>
    <div class="tabs"><button class="${hwTab==="todo"?"on":""}" onclick="setHwTab('todo')">✗ À faire (${todo.length})</button>
    <button class="${hwTab==="done"?"on":""}" onclick="setHwTab('done')">✓ Faits (${fin.length})</button></div>`;
  if(!list.length) h+=`<div class="empty">${hwTab==="todo"?"Rien à faire. Appuie sur un cours pour ajouter un devoir.":"Aucun devoir coché pour l'instant."}</div>`;
  list.forEach(x=>{
    const ev=byKey[x.ckey], due=new Date(x.due);
    h+=`<div class="hwitem" style="${colors(x.code)}">
      <input type="checkbox" class="ck" ${done[x.id]?"checked":""} onclick="toggleDone(${x.id},this.checked)">
      <div class="tx" onclick="${ev?`jumpTo('${esc(x.ckey)}')`:""}">${esc(x.texte)}
        <div class="meta">${esc(x.code)} · pour le ${fmtD(due,{weekday:"short",day:"numeric",month:"short"})}${due<now&&!done[x.id]?" · <b style='color:var(--accent)'>en retard</b>":""}</div></div></div>`;
  });
  return h+`</div>`;
}

/* ======== annonces de la classe (une par jour et par groupe, visibles jusqu'a la date incluse) ======== */
let annonces = store.get("ann", []);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const annGrp = () => tdOf(tp) || tp;
const annVisible = () => annonces.filter(a=>a.jour>=ymd(new Date())).sort((a,b)=>a.jour<b.jour?-1:1);
async function loadAnn(){
  if(!HW_ON || !tp) return;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/annonces?grp=eq.${encodeURIComponent(annGrp())}&deleted=is.false&jour=gte.${ymd(new Date())}&order=jour.asc`, {headers:hdr()});
    if(!r.ok) throw 0;
    annonces = await r.json(); store.set("ann", annonces); if(!sheetKey && !annOpen) render();
  }catch{}
}
function openAnnList(){
  sheetKey = null; annOpen = true;
  const l = annVisible(), today = ymd(new Date());
  let h = `<div class="grab"></div><div class="ann"><div class="head"><b>Annonces ${esc(tdLabel(annGrp()))}</b><button onclick="openAnn()">+ Annonce</button></div>`;
  if(!l.length) h += `<div class="note" style="margin:0 2px 4px">Aucune annonce pour l'instant.</div>`;
  l.forEach(a=>{
    const d = new Date(a.jour+"T12:00:00");
    h += `<div class="annbox ${a.jour===today?"today":""}" onclick="openAnn(${a.id})">
      <div class="d">${a.jour===today?"Aujourd'hui":esc(fmtD(d,{weekday:"short"}))}<span>${esc(fmtD(d,{day:"numeric",month:"short"}))}</span></div>
      <div class="tx">${esc(a.texte)}</div></div>`;
  });
  h += `</div><div class="row"><button class="btn" onclick="closeSheet()">Fermer</button></div>`;
  $("sheet").innerHTML=h; $("sheet").classList.add("open"); $("veil").style.display="block";
}
let annOpen = false;
function openAnn(id){
  sheetKey = null; annOpen = true;
  const a = id ? annonces.find(x=>x.id===id) : null;
  let h = `<div class="grab"></div>`;
  if(a){
    const d = new Date(a.jour+"T12:00:00");
    h += `<h3>Annonce du ${esc(fmtD(d,{weekday:"long",day:"numeric",month:"long"}))}</h3>
      <p class="note">Tu peux modifier le texte ou y ajouter une ligne. Il disparaîtra après cette date.</p>
      <textarea id="anntx" maxlength="2000" style="min-height:120px">${esc(a.texte)}</textarea>
      <div class="row"><button class="btn" onclick="delAnn(${a.id})">Supprimer</button><button class="btn dark" onclick="saveAnnEdit(${a.id})">Enregistrer</button></div>`;
  }else{
    const today = ymd(new Date());
    h += `<h3>Nouvelle annonce</h3>
      <p class="note">Visible par tout le ${esc(tdLabel(annGrp()))} jusqu'à la date choisie. S'il y a déjà une annonce ce jour-là, ton texte s'y ajoute.</p>
      <input type="date" id="anndate" min="${today}" value="${today}">
      <textarea id="anntx" maxlength="2000" placeholder="Ex : DS de méca reporté à jeudi, salle GC-009"></textarea>
      <div class="row"><button class="btn" onclick="openAnnList()">Annuler</button><button class="btn dark" onclick="saveAnnNew()">Publier</button></div>`;
  }
  $("sheet").innerHTML=h; $("sheet").classList.add("open"); $("veil").style.display="block";
}
async function annReq(method, query, body){
  const r = await fetch(`${SUPA_URL}/rest/v1/annonces${query}`, {method, headers:hdr(), body:JSON.stringify(body)});
  if(!r.ok) throw 0;
}
async function saveAnnNew(){
  const jour = $("anndate").value, t = $("anntx").value.trim();
  if(!jour || !t) return;
  if(jour < ymd(new Date())){ toast("Choisis aujourd'hui ou plus tard"); return; }
  try{
    await loadAnn();
    const ex = annonces.find(a=>a.jour===jour);
    if(ex) await annReq("PATCH", `?id=eq.${ex.id}`, {texte:(ex.texte+"\n"+t).slice(0,2000), updated_at:new Date().toISOString()});
    else await annReq("POST", "", {grp:annGrp(), jour, texte:t});
    toast(ex ? "Ajouté à l'annonce de ce jour" : "Annonce publiée");
    await loadAnn(); render(); openAnnList();
  }catch{ toast("Erreur : annonce non enregistrée"); }
}
async function saveAnnEdit(id){
  const t = $("anntx").value.trim();
  if(!t) return delAnn(id);
  try{ await annReq("PATCH", `?id=eq.${id}`, {texte:t, updated_at:new Date().toISOString()}); toast("Annonce modifiée"); await loadAnn(); render(); openAnnList(); }
  catch{ toast("Erreur : modification non enregistrée"); }
}
async function delAnn(id){
  if(!confirm("Supprimer cette annonce pour toute la classe ?")) return;
  try{ await annReq("PATCH", `?id=eq.${id}`, {deleted:true, updated_at:new Date().toISOString()}); toast("Annonce supprimée"); await loadAnn(); render(); openAnnList(); }
  catch{ toast("Erreur"); }
}

/* ======== choix du groupe ======== */
function renderPick(){
  const groups = DATA.groups || {};
  let h=`<div class="pick"><img src="icon.png" width="72" style="border-radius:16px">`;
  if(!pickTd){
    h+=`<h1>Ton groupe ?</h1><p>On s'en souviendra sur ce téléphone.</p><div class="opts">`;
    for(const td of Object.keys(groups)) h+=`<button onclick="pickGroup('${esc(td)}')">${esc(tdLabel(td).replace("Groupe ",""))}</button>`;
    h+=`</div>`;
  }else{
    h+=`<h1>Ton TP ?</h1><p>${esc(tdLabel(pickTd))}</p><div class="opts">`;
    for(const t of groups[pickTd]) h+=`<button onclick="pickTp('${esc(t)}')">${esc(tpLabel(t))}</button>`;
    h+=`</div><button class="back" onclick="pickGroup(null)">‹ Changer de groupe</button>`;
  }
  if(tp && DATA.events[tp]) h+=`<div><button class="back" onclick="cancelPick()">Annuler</button></div>`;
  $("app").innerHTML = h+`</div>`;
}
function startPick(){ pickStep=1; pickTd=null; render(); }
function pickGroup(td){ pickTd=td; const l=DATA.groups[td]; if(td && l.length===1) return pickTp(l[0]); render(); }
function pickTp(t){ tp=t; store.set("tp",t); pickStep=null; pickTd=null; homework=[]; store.set("hw",[]); annonces=[]; store.set("ann",[]); render(); loadHw(); loadAnn(); }
function cancelPick(){ pickStep=null; pickTd=null; render(); }

/* ======== navigation ======== */
function shift(n){ week.setDate(week.getDate()+7*n); render(); }
function goToday(){ now=new Date(); week=monday(now); dayIdx=(now.getDay()+6)%7;
  if(dayIdx>4){ week.setDate(week.getDate()+7); dayIdx=0; } render(); }
function setView(v){ view=v; store.set("view",v); render(); }
function setDay(i){ dayIdx=i; render(); }
function setHwTab(t){ hwTab=t; render(); }
function jumpTo(key){ const e=events().find(x=>x.key===key); if(!e) return; week=monday(e.s); dayIdx=(e.s.getDay()+6)%7; render(); openSheet(key); }
async function shareLink(){
  const url=location.href.split("?")[0].split("#")[0];
  if(navigator.share){ try{ await navigator.share({title:"EDT",text:"Notre emploi du temps + devoirs",url}); }catch{} }
  else { await navigator.clipboard?.writeText(url); toast("Lien copié"); }
}

/* ======== fiche d'un cours ======== */
function openSheet(key, keep){
  const e=events().find(x=>x.key===key); if(!e) return;
  sheetKey=key; if(!keep) editing=null;
  const l=hwFor(key);
  let h=`<div class="grab"></div>
    <h3 style="${colors(e.code)}">${esc(e.code)} ${e.type?`<span class="badge">${esc(typeLbl(e.type))}</span>`:""}</h3>
    <div style="font-weight:600;margin-top:2px">${esc(e.name)}</div>
    <p class="info">${fmtD(e.s,{weekday:"long",day:"numeric",month:"long"})} · ${fmtH(e.s)} – ${fmtH(e.e)}<br>
      Salle ${esc(e.room)}${e.prof?` · ${esc(e.prof)}`:""} · ${esc(e.group)}</p>
    ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:""}`;
  if(!HW_ON){ h+=`<p class="note">Les devoirs ne sont pas encore activés.</p>`; }
  else{
    h+=`<h4>Devoirs pour ce cours <small>visibles par tout le ${esc(tpLabel(tp))}</small></h4>`;
    if(!l.length) h+=`<div class="note" style="margin:0 0 6px">Aucun devoir noté pour ce cours.</div>`;
    l.forEach(x=>{
      if(editing===x.id){
        h+=`<div class="hwrow" style="display:block"><textarea id="edtx" maxlength="1000">${esc(x.texte)}</textarea>
          <div class="row"><button class="btn" onclick="editing=null;openSheet(sheetKey,true)">Annuler</button>
          <button class="btn dark" onclick="saveEdit(${x.id})">Enregistrer</button></div></div>`;
      }else{
        h+=`<div class="hwrow"><input type="checkbox" class="ck" ${done[x.id]?"checked":""} onclick="toggleDone(${x.id},this.checked)">
          <div style="flex:1;min-width:0"><div class="tx ${done[x.id]?"done":""}">${esc(x.texte)}</div>
          <div class="meta">${x.updated_at?"modifié le "+fmtD(new Date(x.updated_at),{day:"numeric",month:"short"})+" à "+fmtH(new Date(x.updated_at)):""}</div></div>
          <div class="act"><button onclick="editing=${x.id};openSheet(sheetKey,true)">Modifier</button><button onclick="delHw(${x.id})">Suppr.</button></div></div>`;
      }
    });
    h+=`<textarea id="newhw" maxlength="1000" placeholder="Écrire un devoir pour ce cours… (ex : exercices 3 à 5 p. 42)"></textarea>
      <div class="row"><button class="btn" onclick="closeSheet()">Fermer</button><button class="btn dark" onclick="saveNew()">Ajouter le devoir</button></div>
      <p class="note">Le devoir est partagé avec ton TP. La case « fait » ne concerne que toi.</p>`;
  }
  if(!HW_ON) h+=`<div class="row"><button class="btn" onclick="closeSheet()">Fermer</button></div>`;
  $("sheet").innerHTML=h; $("sheet").classList.add("open"); $("veil").style.display="block";
}
function closeSheet(){ sheetKey=null; editing=null; annOpen=false; $("sheet").classList.remove("open"); $("veil").style.display="none"; }
async function saveNew(){
  const t=$("newhw").value.trim(); if(!t) return;
  const e=events().find(x=>x.key===sheetKey); if(!e) return;
  $("newhw").value=""; await addHw(e,t);
}
async function saveEdit(id){ const t=$("edtx").value.trim(); if(!t) return; editing=null; await patchHw(id,{texte:t},"Devoir modifié"); }
async function delHw(id){ if(!confirm("Supprimer ce devoir pour tout le TP ?")) return; await patchHw(id,{deleted:true},"Devoir supprimé"); }
$("veil").onclick=closeSheet;

/* ======== demarrage ======== */
addEventListener("keydown",e=>{ if(e.target.tagName==="TEXTAREA") return; if(e.key==="ArrowLeft") shift(-1); if(e.key==="ArrowRight") shift(1); if(e.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ loadData(); loadHw(); loadAnn(); } });
setInterval(()=>{ if(!sheetKey && !annOpen) render(); }, 60000);
setInterval(()=>{ if(!document.hidden){ loadHw(); loadAnn(); } }, 90000);
render(); loadData(); loadHw(); loadAnn();
</script>
</body>
</html>
